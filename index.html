 mdt(L,a){const c=tr('Lighter technical session, hydration plan, sleep plan and a psych check-in — one agreed message to the coach','Sesi teknikal lebih ringan, pelan hidrasi, pelan tidur dan sesi semakan psikologi — satu mesej dipersetujui kepada jurulatih');
  return {title:tr('Morning MDT: day before the semi-final','MDT pagi: sehari sebelum separuh akhir'),data:athCard(a)+tbl([[tr('Physiology','Fisiologi'),tr('HRV −18% vs baseline','HRV −18% berbanding garis dasar')],[tr('Wellness','Kesejahteraan'),'13 / 25'],[tr('Sleep','Tidur'),tr('5.5 h, woke at 3 am','5.5 jam, terjaga pukul 3 pagi')],[tr('Nutrition','Pemakanan'),'USG 1.027'],[tr('Physio','Fisio'),tr('Calf soreness 6/10','Sakit betis 6/10')],[tr('Coach plan','Pelan jurulatih'),tr('Full 2-hour session','Sesi penuh 2 jam')]],[tr('Department','Jabatan'),tr('Report','Laporan')]),
   q:tr('As team leader, what do you take to the coach?','Sebagai ketua pasukan, apa yang anda bawa kepada jurulatih?'),...mkOpts(c,[tr('Train as planned: data is just noise','Berlatih seperti dirancang: data hanya gangguan'),tr('Full rest day without telling the coach why','Rehat sepenuhnya tanpa memberitahu jurulatih sebabnya'),tr('Each department emails the coach separately','Setiap jabatan e-mel jurulatih secara berasingan')]),
   learn:tr('Several small flags (low HRV, poor sleep, dehydration, soreness) together tell a clearer story than any single metric. The team leader\'s job is to integrate them into one practical plan and one voice to the coach.','Beberapa amaran kecil (HRV rendah, tidur lemah, dehidrasi, sakit otot) bersama-sama memberi gambaran lebih jelas daripada satu metrik. Tugas ketua pasukan ialah menggabungkannya menjadi satu pelan praktikal dan satu suara kepada jurulatih.')};},
 conflict(L,a){const c=tr('Run a quick MDT: agree priorities for the semi-final, keep intensity but cut volume, and give the coach one plan','Jalankan MDT ringkas: setuju keutamaan untuk separuh akhir, kekalkan intensiti tetapi kurangkan isipadu, dan beri jurulatih satu pelan');
  return {title:tr('Three experts, three plans','Tiga pakar, tiga pelan'),data:athCard(a)+tbl([['S&C',tr('"Heavy lifting today to keep strength."','"Angkat berat hari ini untuk kekalkan kekuatan."')],[tr('Physio','Fisio'),tr('"Rest. Her back is tight."','"Rehat. Belakangnya tegang."')],[tr('Coach','Jurulatih'),tr('"Full court session."','"Sesi gelanggang penuh."')],[tr('Next match','Perlawanan seterusnya'),tr('Semi-final in 2 days','Separuh akhir dalam 2 hari')]]),
   q:tr('What do you do as team leader?','Apa tindakan anda sebagai ketua pasukan?'),...mkOpts(c,[tr('Side with whoever is most senior','Sokong siapa yang paling kanan'),tr('Let the athlete choose alone','Biar atlet pilih sendiri'),tr('Do all three sessions to keep everyone happy','Buat ketiga-tiga sesi supaya semua gembira')]),
   learn:tr('Integrated support means disagreements happen in the staff room, not in front of the athlete. Agree priorities, use data and taper principles (keep intensity, reduce volume), and present one coherent plan.','Sokongan bersepadu bermakna perselisihan diselesaikan di bilik staf, bukan di hadapan atlet. Setuju keutamaan, guna data dan prinsip taper (kekalkan intensiti, kurangkan isipadu), dan bentangkan satu pelan yang jelas.')};},
 jetlag(L,a){const c=tr('Seek light in the late afternoon and evening, avoid bright light early in the morning for the first days','Dapatkan cahaya pada lewat petang dan awal malam, elak cahaya terang awal pagi pada hari-hari pertama');
  return {title:tr('Landed in Europe','Tiba di Eropah'),data:athCard(a)+tbl([[tr('Flight','Penerbangan'),tr('Kuala Lumpur → Europe, westward','Kuala Lumpur → Eropah, arah barat')],[tr('Time difference','Perbezaan masa'),tr('Clocks 6 h behind','Waktu 6 jam ke belakang')],[tr('Body clock needs to','Jam badan perlu'),tr('Shift later (delay)','Dianjak lebih lewat')]]),q:tr('Which light plan helps adaptation?','Pelan cahaya manakah membantu penyesuaian?'),
   ...mkOpts(c,[tr('Bright light at 6 am every morning','Cahaya terang pukul 6 pagi setiap hari'),tr('Stay in a dark room until competition','Duduk dalam bilik gelap sehingga pertandingan'),tr('Light doesn\'t matter; just sleep more','Cahaya tidak penting; tidur lebih banyak saja')]),
   learn:tr('Light is the strongest signal for the body clock. After flying west the clock must shift later, so evening light helps and early-morning light works against you (the reverse applies eastward). A rough guide is about one day per time zone, so arrive early and shift sleep before departure where possible.','Cahaya ialah isyarat paling kuat untuk jam badan. Selepas terbang ke barat, jam badan perlu dianjak lebih lewat, jadi cahaya waktu petang membantu dan cahaya awal pagi melambatkan penyesuaian (sebaliknya untuk arah timur). Panduan kasar ialah kira-kira satu hari bagi setiap zon waktu, jadi tiba awal dan anjak waktu tidur sebelum berlepas jika boleh.')};},
 heatacc(L,a){const c=tr('10–14 days of daily 60–90 min sessions in the heat, plus cooling and drinking plans on match days','10–14 hari sesi harian 60–90 min dalam panas, serta pelan penyejukan dan minum pada hari perlawanan');
  return {title:tr('Hot venue, air-conditioned squad','Venue panas, skuad biasa berhawa dingin'),data:athCard(a)+tbl([[tr('Venue','Venue'),tr('Outdoor, WBGT ~30 °C','Luar, WBGT ~30 °C')],[tr('Home training','Latihan di tanah air'),tr('Mostly indoors with air-con','Kebanyakannya dalam dewan berhawa dingin')],[tr('Weeks to Games','Minggu ke Temasya'),'4']]),q:tr('What does the physiology team recommend?','Apa cadangan pasukan fisiologi?'),
   ...mkOpts(c,[tr('Nothing: Malaysians are used to heat','Tiada apa: rakyat Malaysia sudah biasa dengan panas'),tr('One very hot session the day before','Satu sesi sangat panas sehari sebelum'),tr('Sauna for 3 hours on arrival','Sauna 3 jam semasa tiba')]),
   learn:tr('Heat acclimation develops over about 10–14 days of regular training in the heat: plasma volume rises, sweating starts earlier, heart rate and core temperature fall. Living in a hot country helps, but athletes who train and live in air-conditioning still benefit from a planned block.','Penyesuaian haba berkembang dalam kira-kira 10–14 hari latihan berkala dalam panas: isipadu plasma meningkat, peluh keluar lebih awal, kadar nadi dan suhu teras menurun. Tinggal di negara panas membantu, tetapi atlet yang berlatih dan tinggal dalam hawa dingin masih mendapat manfaat daripada blok yang dirancang.')};},
 weighcut(L,a){const over=R1(rnd(1.6,2.8));const c=tr('A dietitian-led plan with the team doctor: low-residue diet and modest, monitored fluid changes','Pelan diketuai dietitian bersama doktor pasukan: diet rendah sisa dan perubahan cecair yang sederhana serta dipantau');
  return {title:tr('Over the weight limit','Melebihi had berat'),data:athCard(a)+tbl([[tr('Over limit','Melebihi had'),over+' kg'],[tr('Time to weigh-in','Masa ke timbang'),tr('2 days','2 hari')],[tr('Athlete says','Kata atlet'),tr('"I\'ll just sit in the sauna."','"Saya duduk dalam sauna saja."')]]),q:tr('What is the right plan?','Apakah pelan yang betul?'),
   ...mkOpts(c,[tr('Sauna and spitting until the weight is gone','Sauna dan meludah sehingga berat turun'),tr('Diuretic tablets from a pharmacy','Tablet diuretik dari farmasi'),tr('Stop eating and drinking for two days','Berhenti makan dan minum selama dua hari')]),
   learn:tr('Rapid dehydration harms performance and health, and diuretics are prohibited by WADA (they can mask other substances). Small, planned reductions guided by the dietitian and doctor, followed by proper rehydration after weigh-in, are the safe route. Long-term weight-class planning prevents last-minute cuts.','Dehidrasi pantas menjejaskan prestasi dan kesihatan, dan diuretik dilarang oleh WADA (ia boleh menyembunyikan bahan lain). Pengurangan kecil yang dirancang dengan bimbingan dietitian dan doktor, diikuti penghidratan semula yang betul selepas timbang, ialah cara yang selamat. Perancangan kelas berat jangka panjang mengelakkan pemotongan saat akhir.')};},
 foodsafe(L,a){const c=tr('Stick to familiar, carbohydrate-focused team meals, bottled water and good hand hygiene before the final','Kekal dengan hidangan pasukan yang biasa dan berasaskan karbohidrat, air botol dan kebersihan tangan yang baik sebelum perlawanan akhir');
  return {title:tr('Night market before the final','Pasar malam sebelum perlawanan akhir'),data:athCard(a)+tbl([[tr('Request','Permintaan'),tr('Squad wants street food tonight','Skuad mahu makan di gerai jalanan malam ini')],[tr('Tomorrow','Esok'),tr('Final at 20:00','Akhir pukul 20:00')]]),q:tr('What does the nutrition lead advise?','Apa nasihat ketua pemakanan?'),
   ...mkOpts(c,[tr('Try everything: it\'s a cultural experience','Cuba semua: ini pengalaman budaya'),tr('Skip dinner to stay light','Tidak makan malam supaya ringan'),tr('Big spicy meal to boost energy','Makanan pedas berat untuk tambah tenaga')]),
   learn:tr('A stomach bug the night before a final can end a campaign. Before key matches, keep to familiar, tested foods, bottled or treated water and strict hand hygiene. Celebrate local food after competition.','Sakit perut pada malam sebelum perlawanan akhir boleh menamatkan kempen. Sebelum perlawanan penting, kekal dengan makanan biasa yang telah diuji, air botol atau dirawat, dan kebersihan tangan yang ketat. Raikan makanan tempatan selepas pertandingan.')};},
 villagesleep(L,a){const c=tr('Ask the team manager to sort rooms, give eye masks and earplugs, set a screen and caffeine cut-off','Minta pengurus pasukan susun semula bilik, beri penutup mata dan penyumbat telinga, tetapkan had skrin dan kafein');
  return {title:tr('Noisy village, tired athlete','Perkampungan bising, atlet letih'),data:athCard(a)+tbl([[tr('Sleep last 2 nights','Tidur 2 malam lalu'),tr('5 h, 5.5 h','5 jam, 5.5 jam')],[tr('Cause','Punca'),tr('Roommate gaming until 2 am, noisy corridor','Rakan sebilik main permainan sehingga 2 pagi, koridor bising')]]),q:tr('What is the integrated fix?','Apakah penyelesaian bersepadu?'),
   ...mkOpts(c,[tr('Sleeping pills from another team','Pil tidur daripada pasukan lain'),tr('Tell the athlete to toughen up','Suruh atlet lebih tabah'),tr('Extra coffee in the morning','Kopi tambahan pada waktu pagi')]),
   learn:tr('Sleep is one of the easiest performance gains to protect at a Games. Practical fixes (rooming, eye masks, earplugs, routines, caffeine timing) come through the team manager and staff together. Medicines only via the team doctor.','Tidur ialah antara peningkatan prestasi yang paling mudah dilindungi di Temasya. Penyelesaian praktikal (susunan bilik, penutup mata, penyumbat telinga, rutin, masa kafein) dilaksanakan bersama pengurus pasukan dan staf. Ubat hanya melalui doktor pasukan.')};},
 coldmeds(L,a){const c=tr('Don\'t take it: see the team doctor, who checks the ingredients against the WADA list first','Jangan ambil: jumpa doktor pasukan yang akan menyemak ramuan dengan senarai WADA dahulu');
  return {title:tr('Bought cold medicine at a local pharmacy','Beli ubat selesema di farmasi tempatan'),data:athCard(a)+tbl([[tr('Product','Produk'),tr('Local cold & flu tablets (label in the local language)','Tablet selesema tempatan (label dalam bahasa tempatan)')],[tr('Competition','Pertandingan'),tr('Tomorrow, in-competition testing','Esok, ujian dalam pertandingan')]]),q:tr('What do you advise?','Apa nasihat anda?'),
   ...mkOpts(c,[tr('Take half a dose to be safe','Ambil separuh dos supaya selamat'),tr('It\'s just cold medicine, it\'s fine','Ubat selesema saja, tak apa'),tr('Ask another athlete what they took','Tanya atlet lain apa yang mereka ambil')]),
   learn:tr('Some cold medicines contain stimulants such as pseudoephedrine, which is prohibited in-competition above a threshold. Labels abroad can be hard to read and brand names differ. Every medicine goes through the team doctor; if one is genuinely needed, a Therapeutic Use Exemption (TUE) may apply.','Sesetengah ubat selesema mengandungi perangsang seperti pseudoefedrin, yang dilarang dalam pertandingan melebihi ambang tertentu. Label di luar negara sukar dibaca dan jenama berbeza. Setiap ubat mesti melalui doktor pasukan; jika benar-benar diperlukan, Pengecualian Penggunaan Terapeutik (TUE) mungkin terpakai.')};},
 kpis(L,a){const c=tr('3–5 key indicators that answer the coach\'s questions, shown as a simple traffic-light view','3–5 penunjuk utama yang menjawab soalan jurulatih, dipaparkan sebagai paparan lampu isyarat yang ringkas');
  return {title:tr('Forty metrics, zero decisions','Empat puluh metrik, tiada keputusan'),data:tbl([[tr('Daily dashboard','Papan pemuka harian'),tr('40 metrics from 6 departments','40 metrik daripada 6 jabatan')],[tr('Coach says','Kata jurulatih'),tr('"I don\'t read it. Just tell me who\'s ready."','"Saya tak baca. Beritahu saja siapa yang bersedia."')]]),q:tr('How do you redesign it?','Bagaimana anda mereka bentuk semula?'),
   ...mkOpts(c,[tr('Add more metrics so nothing is missed','Tambah lebih banyak metrik supaya tiada yang terlepas'),tr('Stop collecting data at the Games','Berhenti mengumpul data di Temasya'),tr('Send the raw spreadsheet daily','Hantar hamparan mentah setiap hari')]),
   learn:tr('Integrated support is judged by decisions, not data volume. Start from the coach\'s questions ("who is ready, who needs care?"), choose a few valid indicators, and present them simply with a clear action for each flag.','Sokongan bersepadu dinilai melalui keputusan, bukan jumlah data. Mulakan dengan soalan jurulatih ("siapa bersedia, siapa perlu perhatian?"), pilih beberapa penunjuk yang sah, dan paparkan dengan ringkas bersama tindakan jelas bagi setiap amaran.')};},
 staffdebrief(L,a){const c=tr('What worked, what didn\'t, tomorrow\'s plan, and a quick check on staff wellbeing — no confidential athlete details','Apa yang berjaya, apa yang tidak, pelan esok, dan semakan ringkas kesejahteraan staf — tanpa butiran sulit atlet');
  return {title:tr('End-of-day staff debrief','Taklimat staf hujung hari'),data:tbl([[tr('Attending','Hadir'),tr('Coach, team manager, doctor, physio, S&C, nutrition, psych','Jurulatih, pengurus pasukan, doktor, fisio, S&C, pemakanan, psikologi')],[tr('Time available','Masa'),'20 min']]),q:tr('What structure do you use?','Struktur apa yang anda gunakan?'),
   ...mkOpts(c,[tr('Go through every athlete\'s psych notes','Semak nota psikologi setiap atlet'),tr('Skip it: everyone is tired','Langkau: semua orang letih'),tr('Blame whoever made mistakes today','Salahkan sesiapa yang buat silap hari ini')]),
   learn:tr('Short, structured daily debriefs keep a multi-disciplinary team aligned during long competitions. Include staff wellbeing — Games-time staff burnout is common — and keep confidential athlete information out of group settings.','Taklimat harian yang ringkas dan berstruktur memastikan pasukan pelbagai disiplin sehaluan semasa pertandingan panjang. Sertakan kesejahteraan staf — burnout staf semasa Temasya adalah biasa — dan jauhkan maklumat sulit atlet daripada sesi berkumpulan.')};},
 betweenmatch(L,a){const c=tr('Cool down and refuel (≈1 g/kg carbs + fluids/electrolytes), cooling, a short psych reset with two tactical points, re-warm 15 min before','Bertenang dan isi tenaga (≈1 g/kg karbohidrat + cecair/elektrolit), penyejukan, set semula psikologi ringkas dengan dua poin taktikal, panaskan semula 15 min sebelum');
  return {title:tr(`${live()}: 45 minutes to the next match`,`${live()}: 45 minit ke perlawanan seterusnya`),data:athCard(a)+tbl([[tr('Just finished','Baru selesai'),tr('Long, hot 3-set match','Perlawanan panjang 3 set yang panas')],[tr('Next match','Perlawanan seterusnya'),tr('In 45 min','Dalam 45 min')]]),q:tr('What is the between-match plan?','Apakah pelan antara perlawanan?'),
   ...mkOpts(c,[tr('Full video review of the last match','Semakan video penuh perlawanan tadi'),tr('Rest lying down until called','Baring rehat sehingga dipanggil'),tr('Big lunch to recover','Makan tengah hari besar untuk pulih')]),
   learn:tr('Short turnarounds need a pre-agreed sequence across departments: recovery and fuel (nutrition, physiology), cooling, a brief mental reset with one or two tactical cues (psych and coach), then a re-warm-up (S&C). Rehearse it before the event.','Masa rehat singkat memerlukan urutan yang dipersetujui merentas jabatan: pemulihan dan tenaga (pemakanan, fisiologi), penyejukan, set semula mental ringkas dengan satu atau dua isyarat taktikal (psikologi dan jurulatih), kemudian panaskan badan semula (S&C). Latih urutan ini sebelum acara.')};},
 injury(L,a){const c=tr('Back the physio and doctor\'s call; you manage the coach, the psych team supports the athlete either way','Sokong keputusan fisio dan doktor; anda uruskan jurulatih, pasukan psikologi menyokong atlet walau apa keputusannya');
  return {title:tr(`${live()}: ankle roll mid-match`,`${live()}: buku lali terseliuh di tengah perlawanan`),data:athCard(a)+tbl([[tr('Physio','Fisio'),tr('Assessing now','Sedang menilai')],[tr('Coach shouts','Jurulatih menjerit'),tr('"Tape it, she plays!"','"Balut, dia main!"')],[tr('Athlete','Atlet'),tr('"I can go on."','"Saya boleh teruskan."')]]),q:tr('What do you do?','Apa tindakan anda?'),
   ...mkOpts(c,[tr('Agree with the coach to keep the peace','Setuju dengan jurulatih untuk menjaga keadaan'),tr('Make the medical call yourself','Buat keputusan perubatan sendiri'),tr('Ask the athlete to decide alone','Minta atlet buat keputusan sendiri')]),
   learn:tr('Fitness-to-play is a medical decision. The team leader protects that boundary under pressure, manages the coach calmly and makes sure the athlete is supported psychologically whether they continue or withdraw.','Kelayakan untuk bermain ialah keputusan perubatan. Ketua pasukan melindungi sempadan itu dalam tekanan, menguruskan jurulatih dengan tenang dan memastikan atlet disokong dari segi psikologi sama ada mereka meneruskan atau menarik diri.')};},
 timeout(L,a){const c=tr('One breath, one process cue, one tactical focus — short and calm','Satu nafas, satu isyarat proses, satu fokus taktikal — ringkas dan tenang');
  return {title:tr(`${live()}: down at the interval`,`${live()}: ketinggalan semasa rehat`),data:athCard(a)+tbl([[tr('Score','Skor'),tr('Trailing, momentum lost','Ketinggalan, momentum hilang')],[tr('Time','Masa'),tr('60-second interval','Rehat 60 saat')],[tr('Athlete','Atlet'),tr('Fast breathing, eyes down','Nafas laju, mata ke bawah')]]),q:tr('What message goes in?','Mesej apakah yang disampaikan?'),
   ...mkOpts(c,[tr('A long list of everything going wrong','Senarai panjang semua yang tidak kena'),tr('"You must win this, the country is watching!"','"Awak mesti menang, seluruh negara sedang menonton!"'),tr('Silence — let them figure it out','Diam — biar mereka fikir sendiri')]),
   learn:tr('Under pressure, attention narrows and working memory shrinks. Interval messages should be short and process-focused: settle physiology (one slow breath), one cue they can act on, one tactical point agreed with the coach.','Dalam tekanan, tumpuan menyempit dan ingatan kerja mengecil. Mesej semasa rehat perlu ringkas dan fokus pada proses: tenangkan fisiologi (satu nafas perlahan), satu isyarat yang boleh dilaksanakan, satu poin taktikal yang dipersetujui jurulatih.')};},
 coachrage(L,a){const c=tr('Don\'t confront in public; quietly feed one calm cue through the assistant coach, then debrief the coach privately after','Jangan bersemuka di khalayak; sampaikan satu isyarat tenang melalui penolong jurulatih, kemudian berbincang dengan jurulatih secara peribadi selepas itu');
  return {title:tr(`${live()}: coach shouting at the athlete`,`${live()}: jurulatih menjerit pada atlet`),data:athCard(a)+tbl([[tr('Situation','Situasi'),tr('Coach screaming during the break, cameras nearby','Jurulatih menjerit semasa rehat, kamera berdekatan')],[tr('Athlete','Atlet'),tr('Shrinking, no eye contact','Mengecut, tiada hubungan mata')]]),q:tr('What do you do right now?','Apa yang anda lakukan sekarang?'),
   ...mkOpts(c,[tr('Argue with the coach in front of the team','Bertengkar dengan jurulatih di hadapan pasukan'),tr('Do nothing and say nothing later either','Tidak buat apa-apa dan tidak berkata apa-apa kemudian'),tr('Post about it online','Kongsi di media sosial')]),
   learn:tr('Public conflict hurts the athlete most. In the moment, support the athlete through agreed channels; afterwards, give the coach private, specific feedback. Agree communication rules for competition breaks before the event.','Konflik di khalayak paling merugikan atlet. Pada saat itu, sokong atlet melalui saluran yang dipersetujui; selepas itu, beri maklum balas peribadi dan spesifik kepada jurulatih. Persetujui peraturan komunikasi semasa rehat pertandingan sebelum acara.')};},
 warmdelay(L,a){const c=tr('Keep warm with jackets and light movement, then a 10–15 min re-warm-up with short, sharp efforts; a small carb snack if the wait is long','Kekal panas dengan jaket dan pergerakan ringan, kemudian panaskan semula 10–15 min dengan usaha pendek dan pantas; snek karbohidrat kecil jika menunggu lama');
  return {title:tr(`${live()}: start delayed 40 minutes`,`${live()}: permulaan ditangguh 40 minit`),data:athCard(a)+tbl([[tr('Status','Status'),tr('Athletes already warmed up','Atlet sudah memanaskan badan')],[tr('New start','Mula baharu'),tr('+40 min','+40 min')]]),q:tr('What is the plan?','Apakah pelannya?'),
   ...mkOpts(c,[tr('Sit down and cool off until called','Duduk dan sejukkan badan sehingga dipanggil'),tr('Repeat the full 40-min warm-up','Ulang memanaskan badan penuh 40 min'),tr('Go back to the village','Kembali ke perkampungan')]),
   learn:tr('Warm-up benefits fade within roughly 15–20 minutes of inactivity. Keep muscle temperature up (passive heat, light activity), re-warm with brief high-intensity efforts close to the start, use a refocus routine, and top up carbohydrate if the delay is long.','Manfaat memanaskan badan berkurang dalam kira-kira 15–20 minit tanpa aktiviti. Kekalkan suhu otot (haba pasif, aktiviti ringan), panaskan semula dengan usaha intensiti tinggi yang ringkas hampir dengan waktu mula, guna rutin fokus semula, dan tambah karbohidrat jika penangguhan panjang.')};},
 triage(L,a){const c=tr('Physio tapes the athlete who plays in 40 min, team doctor assesses the new knee pain, recovery work for the sore athlete later','Fisio membalut atlet yang bermain dalam 40 min, doktor pasukan menilai sakit lutut baharu, kerja pemulihan untuk atlet yang sakit otot kemudian');
  return {title:tr(`${live()}: one physio, three athletes`,`${live()}: seorang fisio, tiga atlet`),data:tbl([['A',tr('Plays in 40 min, needs ankle taping','Bermain dalam 40 min, perlu balutan buku lali')],['B',tr('General soreness from yesterday, plays tomorrow','Sakit otot umum dari semalam, bermain esok')],['C',tr('New knee pain this morning, no match today','Sakit lutut baharu pagi ini, tiada perlawanan hari ini')]],[tr('Athlete','Atlet'),tr('Need','Keperluan')]),q:tr('How do you organise the medical team?','Bagaimana anda menyusun pasukan perubatan?'),
   ...mkOpts(c,[tr('First come, first served','Siapa datang dulu, dia dulu'),tr('Treat the most senior athlete first','Rawat atlet paling senior dahulu'),tr('Ask the coach to choose','Minta jurulatih memilih')]),
   learn:tr('Triage by time-criticality and clinical need, and use the whole team: the physio covers what only they can do now, the doctor takes the new injury, and recovery work is scheduled. The leader\'s job is to unblock, not to treat.','Triaj mengikut keperluan masa dan klinikal, dan gunakan seluruh pasukan: fisio melakukan apa yang hanya mereka boleh buat sekarang, doktor mengambil kecederaan baharu, dan kerja pemulihan dijadualkan. Tugas ketua ialah melancarkan, bukan merawat.')};},
 bus(L,a){const c=tr('Team manager activates the backup transport, you adjust the warm-up plan for the venue and keep athletes informed calmly','Pengurus pasukan menggerakkan pengangkutan sandaran, anda laraskan pelan memanaskan badan di venue dan maklumkan atlet dengan tenang');

    const cv=$('#mgWave'),x=cv.getContext('2d');x.fillStyle='#10202a';x.fillRect(0,0,600,120);x.strokeStyle='#4fd1c5';x.lineWidth=3;x.beginPath();const amp=8+co*40;for(let i=0;i<600;i++){const tt=MG.t-((600-i)/600)*8;x.lineTo(i,60-Math.sin(tt/c*Math.PI*2)*amp*(.7+.3*Math.sin(tt*7.3))+Math.sin(tt*31)*(1-co)*14);}x.stroke();

function updateShift(dt){
  const g=G,D=g.D;const dm=dt*D.speed*(g.explore?.5:1);g.t+=dm;
  if(!g.explore){
    const N=g.needs;N.energy=clamp(N.energy-.11*dm*D.drain*(P.speed>4.5?1.6:1),0,100);N.bladder=clamp(N.bladder+.13*dm*D.drain,0,100);
    const od=g.jobs.filter(j=>j.overdue).length;N.vibes=clamp(N.vibes+(od?-.06*od:.02)*dm-.012*dm,0,100);
    g.chaos=clamp(g.chaos+(od?od*.22:-.18)*dm,0,100);g.peakChaos=Math.max(g.peakChaos,g.chaos);
    if(N.bladder>=100){N.bladder=0;N.vibes=clamp(N.vibes-40,0,100);g.chaos=clamp(g.chaos+10,0,100);bang(tr('DIDN\'T MAKE IT','TAK SEMPAT'),'r');say(who('tech'),tr('I\'ll get the mop…','Saya ambil mop…'),true);sfx('bad');}
    if(N.energy<=0){endShift('collapse');return;}
    if(N.vibes<=0&&!g.scripted.lowcare){g.scripted.lowcare=1;say(who('hop'),tr('You look exhausted. Come for supervision.','Awak nampak sangat letih. Datang untuk penyeliaan.'),true);const s=GJ.find(x=>x.k==='super').make();s.tpl='super';s.pri='HOT';addJob(s);}
    if(g.t>=g.nextJob&&g.t<g.PO.t1-15){spawnJob();const rush=(g.t>=480&&g.t<720)||(g.t>=780&&g.t<930)?.8:1;g.nextJob=g.t+rnd(D.jobGap[0],D.jobGap[1])*rush;}
    if(!g.scripted.first&&g.t>=g.PO.t0+1){g.scripted.first=1;spawnJob();}
    updateGames();
    for(const j of g.jobs.slice()){if(!j.overdue&&g.t>j.due){j.overdue=true;g.chaos=clamp(g.chaos+6,0,100);N.vibes=clamp(N.vibes-5,0,100);say(j.from,tr('OVERDUE: ','LEWAT: ')+j.title,true);sfx('bad');}
      if(j.overdue&&g.t>j.due+(j.pri==='ROUTINE'?70:45))missJob(j);}
    if(!g.phone&&g.t>=g.nextPhone&&g.t<g.PO.t1-10&&!DV.on){ringPhone();g.nextPhone=g.t+rnd(45,90)/(g.lvl>=4?1.4:1);}
    if(g.phone){g.phone.until-=dt;$('#phoneCd').textContent=Math.max(0,Math.ceil(g.phone.until));g.ringT=(g.ringT||0)-dt;if(g.ringT<=0){g.ringT=1.1;sfx('ring');}
      if(g.phone.until<=0){g.phone=null;$('#phoneBtn').hidden=true;g.chaos=clamp(g.chaos+5,0,100);N.vibes=clamp(N.vibes-4,0,100);say(tr('Missed call','Panggilan terlepas'),tr('Someone needed you.','Ada yang memerlukan anda.'),true);}}
    if(!g.auntie&&g.chaos>=60)spawnBoss();
    if(Math.floor(g.t)!==g.lastMin){g.lastMin=Math.floor(g.t);if(N.bladder>85&&g.lastMin%20===0)say(tr('Your bladder','Pundi kencing anda'),tr('Tandas. Now. Please.','Tandas. Sekarang. Tolong.'),true);if(N.energy<18&&g.lastMin%25===0)say(tr('Your stomach','Perut anda'),tr('Eat something before you faint.','Makan sesuatu sebelum pengsan.'),true);}
  }
  if(g.t>=g.PO.t1){if(g.explore)g.t=g.PO.t0;else endShift('time');}
}

  else if(g.explore){trk.hidden=false;trk.textContent=tr('Explore · walk up to any room to learn what happens there','Jelajah · dekati mana-mana bilik untuk belajar apa yang berlaku di sana');}else trk.hidden=true;

  mx.fillStyle='#eee9f1';mx.fillRect(-16,-16,32,16);mx.fillStyle='#3f9a6b';mx.fillRect(20,-16,18,14);mx.fillStyle='#2b2f33';mx.fillRect(-20,13,16,10);

const keys={};let joyV={x:0,y:0},joyId=null,lookId=null,lookLast=null,joyOrigin=null;
const touch=$('#touch'),joyEl=$('#joy');
touch.addEventListener('pointerdown',e=>{if(!G.on||G.paused)return;const left=e.clientX<innerWidth*.45&&e.pointerType!=='mouse'||(e.pointerType==='mouse'&&e.button===0&&e.clientX<innerWidth*.45);
  if(left&&joyId==null){joyId=e.pointerId;joyOrigin={x:e.clientX,y:e.clientY};joyEl.style.display='block';joyEl.style.left=e.clientX+'px';joyEl.style.top=e.clientY+'px';}
  else if(lookId==null){lookId=e.pointerId;lookLast={x:e.clientX,y:e.clientY};}
  try{touch.setPointerCapture(e.pointerId);}catch(_){}});
touch.addEventListener('pointermove',e=>{if(e.pointerId===joyId){let dx=e.clientX-joyOrigin.x,dy=e.clientY-joyOrigin.y;const d=Math.hypot(dx,dy),m=55;if(d>m){dx=dx/d*m;dy=dy/d*m;}joyV={x:dx/m,y:dy/m};joyEl.firstChild.style.transform=`translate(${dx}px,${dy}px)`;}
  else if(e.pointerId===lookId){const dx=e.clientX-lookLast.x,dy=e.clientY-lookLast.y;lookLast={x:e.clientX,y:e.clientY};P.yaw-=dx*.008;P.pitch=clamp(P.pitch+dy*.004,.22,1.1);}});
function endPtr(e){if(e.pointerId===joyId){joyId=null;joyV={x:0,y:0};joyEl.style.display='none';joyEl.firstChild.style.transform='';}if(e.pointerId===lookId)lookId=null;}

  tr('Copy the real timings, call room, delays and noise, then rehearse routines','Tiru masa sebenar, bilik panggilan, kelewatan dan bunyi, kemudian latih rutin'),[tr('A normal training session with a bit more intensity','Sesi latihan biasa dengan intensiti sedikit tinggi'),tr('A fun match with no scores so nobody gets stressed','Perlawanan suka-suka tanpa skor supaya tiada tekanan'),tr('Show videos of past Games ceremonies to inspire them','Tunjuk video upacara temasya lalu untuk memberi inspirasi')],
  tr('Simulation turns the unknown into the familiar. Copying start times, warm-up length, the call room, delays and crowd noise lets athletes practise their routines and coping plans under Games-like conditions, so fewer things surprise them on the day.','Simulasi menukar perkara asing menjadi biasa. Meniru masa mula, tempoh memanaskan badan, bilik panggilan, kelewatan dan bunyi penonton membolehkan atlet melatih rutin dan pelan menangani dalam keadaan seperti temasya, jadi kurang perkara yang mengejutkan pada hari sebenar.'));},
 ag_social(L,a){return SQ(tr('Phones in the village','Telefon di perkampungan'),athCard(a)+tbl([[tr('Situation','Situasi'),tr('Scrolling comments until 1 am before competing','Membaca komen sehingga 1 pagi sebelum bertanding')],[tr('Athlete says','Kata atlet'),tr('"I just want to see what people are saying."','"Saya cuma nak tengok apa orang cakap."')]]),tr('What do you agree with the athlete?','Apa yang anda persetujui dengan atlet?'),
  tr('A personal plan: when to post, no comments on competition days, phone out at night','Pelan peribadi: bila memuat naik, tiada komen pada hari bertanding, telefon di luar waktu malam'),[tr('Confiscate every phone in the squad until the Games end','Rampas semua telefon skuad sehingga temasya tamat'),tr('Nothing: social media is part of being an athlete now','Tiada apa: media sosial memang sebahagian hidup atlet'),tr('Reply to the negative comments to clear things up','Balas komen negatif untuk menjelaskan keadaan')],
  tr('Phones connect athletes to family, which helps, but late-night scrolling hurts sleep and comments pull attention to outcomes. A plan the athlete agrees to works better than a ban: posting windows, someone else managing comments, and no phone in bed.','Telefon menghubungkan atlet dengan keluarga, dan itu membantu, tetapi membaca lewat malam menjejaskan tidur dan komen menarik tumpuan kepada keputusan. Pelan yang dipersetujui atlet lebih berkesan daripada larangan: masa memuat naik, orang lain mengurus komen, dan tiada telefon di katil.'));},
 ag_callroom(L,a){return SQ(tr(`${live()}: 15 minutes in the call room`,`${live()}: 15 minit di bilik panggilan`),athCard(a)+tbl([[tr('Athlete','Atlet'),tr('Pacing, watching rivals, breathing fast','Mundar-mandir, memerhati lawan, bernafas laju')],[tr('You can','Anda boleh'),tr('Send one short message via the coach','Hantar satu mesej ringkas melalui jurulatih')]]),tr('What message do you send?','Mesej apa yang anda hantar?'),
  tr('"Slow breath, run your routine, eyes on your own lane."','"Nafas perlahan, jalankan rutin, mata pada laluan sendiri."'),[tr('"Ignore the nerves; everyone back home is watching."','"Abaikan gemuruh; semua orang di tanah air menonton."'),tr('"Study your rivals closely to find their weakness."','"Perhati lawan dengan teliti untuk cari kelemahan."'),tr('"Go over every technical point one more time."','"Semak setiap poin teknikal sekali lagi."')],
  tr('The call room is a pressure cooker of waiting and comparison. A short message that settles breathing, triggers the practised routine and points attention to the athlete\'s own task beats extra information or reminders of what is at stake.','Bilik panggilan penuh dengan tekanan menunggu dan perbandingan. Mesej ringkas yang menenangkan pernafasan, mencetuskan rutin yang dilatih dan mengarahkan tumpuan kepada tugas sendiri lebih baik daripada maklumat tambahan atau peringatan tentang apa yang dipertaruhkan.'));},
 ag_postblues(L,a){return SQ(tr('Two weeks after the Games','Dua minggu selepas temasya'),athCard(a)+tbl([[tr('Athlete says','Kata atlet'),tr('"Everything feels flat now. I don\'t want to train."','"Semuanya terasa hambar sekarang. Saya tak mahu berlatih."')],[tr('Also','Juga'),tr('Sleeping a lot, not seeing friends','Banyak tidur, tidak jumpa kawan')]]),tr('What is the right response?','Apakah tindak balas yang betul?'),
  tr('Normalise the dip, plan a gentle restart, check in weekly, refer if it persists','Normalkan penurunan ini, rancang permulaan semula perlahan, semak setiap minggu, rujuk jika berterusan'),[tr('Book the next competition at once to restore motivation','Tempah pertandingan seterusnya segera untuk pulihkan motivasi'),tr('Tell them to be grateful they went to the Games at all','Suruh mereka bersyukur kerana dapat ke temasya'),tr('Leave them alone until they feel like training again','Biarkan mereka sehingga mereka rasa mahu berlatih semula')],
  tr('A low period after a major Games is common, after wins as well as losses: the goal that organised life for years is suddenly gone. Normalise it, rebuild structure gently, stay in touch, and refer through the medical pathway if low mood lasts or deepens.','Tempoh mood rendah selepas temasya besar adalah biasa, selepas menang atau kalah: matlamat yang menyusun hidup bertahun-tahun tiba-tiba tiada. Normalkan, bina semula struktur secara perlahan, kekal berhubung, dan rujuk melalui laluan perubatan jika mood rendah berpanjangan atau bertambah teruk.'));},
 ag_report(L,a){return SQ(tr('Writing the post-Games report','Menulis laporan pasca temasya'),tbl([[tr('For','Untuk'),tr('National sports institute and the sport\'s association','Institut sukan kebangsaan dan persatuan sukan')],[tr('You have','Anda ada'),tr('Session notes, screening data, staff debriefs','Nota sesi, data saringan, taklimat staf')]]),tr('What goes in the report?','Apa yang dimasukkan dalam laporan?'),
  tr('Squad-level themes, what worked, what to change, without private athlete details','Tema peringkat skuad, apa yang berjaya, apa perlu diubah, tanpa butiran peribadi atlet'),[tr('Each athlete\'s session notes so leaders see the full picture','Nota sesi setiap atlet supaya pemimpin nampak gambaran penuh'),tr('Only the medal table, since results speak for themselves','Hanya jadual pingat, kerana keputusan sudah menjelaskan'),tr('A list of which athletes coped badly under pressure','Senarai atlet yang tidak dapat mengatasi tekanan')],
  tr('A good report helps the next campaign: what the service delivered, which approaches helped, gaps in resources, and clear recommendations. Use aggregated, de-identified information; individual content stays confidential unless the athlete agrees.','Laporan yang baik membantu kempen seterusnya: apa yang diberikan perkhidmatan, pendekatan yang membantu, kekurangan sumber, dan cadangan yang jelas. Gunakan maklumat terkumpul tanpa identiti; kandungan individu kekal sulit kecuali atlet bersetuju.'));},
 pg_language(L,a){return SQ(tr('Briefing new staff for the para squad','Taklimat staf baharu untuk skuad para'),athCard(a)+tbl([[tr('New staff member wrote','Staf baharu menulis'),tr('"Our brave wheelchair-bound heroes who suffer from…"','"Wira berani kita yang terikat pada kerusi roda dan menderita…"')]]),tr('What guidance do you give?','Apa panduan yang anda beri?'),
  tr('Talk about them as athletes first, and ask each athlete which words they prefer','Bercakap tentang mereka sebagai atlet dahulu, dan tanya setiap atlet perkataan pilihan mereka'),[tr('Keep it: emotional words help people feel inspired by them','Kekalkan: perkataan beremosi membuatkan orang terinspirasi'),tr('Never mention disability at all, even when it is relevant','Jangan sebut kecacatan langsung, walaupun ia berkaitan'),tr('Use medical terms only, since they are the most precise','Guna istilah perubatan sahaja kerana paling tepat')],
  tr('Para athletes are elite athletes. Phrases like "suffers from" or "wheelchair-bound" and "inspiration" framing reduce them to their impairment. Preferences differ, so ask each athlete how they describe themselves and follow their lead.','Atlet para ialah atlet elit. Frasa seperti "menderita" atau "terikat pada kerusi roda" dan pembingkaian "inspirasi" mengecilkan mereka kepada kecacatan. Pilihan berbeza, jadi tanya setiap atlet bagaimana mereka menggambarkan diri dan ikut pilihan mereka.'));},
 pg_guide(L,a){const b=Object.assign(mkAthlete('para'),{sex:'F'});return SQ(tr('Sprinter and guide runner keep clashing','Pelari pecut dan pemandu larian asyik bertelagah'),athCard(b,tr('T11, with guide runner','T11, dengan pemandu larian'))+tbl([[tr('Athlete says','Kata atlet'),tr('"He calls the bend too late."','"Dia beri isyarat selekoh terlalu lambat."')],[tr('Guide says','Kata pemandu'),tr('"She never tells me what she needs."','"Dia tak pernah beritahu apa yang dia perlukan."')]]),tr('What do you do?','Apa tindakan anda?'),
  tr('A joint session to agree cues, roles and a reset routine, practised in training','Sesi bersama untuk setuju isyarat, peranan dan rutin set semula, dilatih dalam latihan'),[tr('Find the athlete a new guide before the Games start','Cari pemandu baharu untuk atlet sebelum temasya bermula'),tr('Work only with the athlete; the guide is just support','Bekerja dengan atlet sahaja; pemandu hanya sokongan'),tr('Tell them both to stay quiet and focus on running','Suruh kedua-duanya diam dan fokus pada larian')],
  tr('A visually impaired sprinter and guide compete as one unit, and guides are recognised as part of the team. Treat them like a doubles pair: shared goals, agreed verbal cues, clear roles and a plan for resetting after mistakes, all rehearsed together.','Pelari cacat penglihatan dan pemandunya bertanding sebagai satu unit, dan pemandu diiktiraf sebagai sebahagian pasukan. Layan mereka seperti pasangan beregu: matlamat bersama, isyarat lisan yang dipersetujui, peranan yang jelas dan pelan set semula selepas silap, semuanya dilatih bersama.'));},
 pg_class(L,a){return SQ(tr('Classification review at the Games','Semakan klasifikasi di temasya'),athCard(a)+tbl([[tr('Status','Status'),tr('Under review: assessed again on arrival','Dalam semakan: dinilai semula semasa tiba')],[tr('Athlete says','Kata atlet'),tr('"What if they move me to another class?"','"Bagaimana kalau mereka pindahkan saya ke kelas lain?"')]]),tr('How do you help?','Bagaimana anda membantu?'),
  tr('Explain the process with the team, focus on giving honest full effort, plan for both outcomes','Terangkan proses bersama pasukan, fokus pada usaha penuh yang jujur, rancang untuk kedua-dua keputusan'),[tr('Advise them to underperform slightly during the assessment','Nasihatkan mereka berprestasi kurang sedikit semasa penilaian'),tr('Tell them classification rarely changes, so not to worry','Beritahu bahawa klasifikasi jarang berubah, jadi jangan risau'),tr('Ask the classifiers privately what result to expect','Tanya pengelas secara peribadi apa keputusan dijangka')],
  tr('Classification groups athletes by how their impairment affects their sport, and a review at a Games is stressful because it can change who they race. Help the athlete understand the process (with the team doctor or manager), give full honest effort (intentional misrepresentation breaks the rules) and prepare for either outcome.','Klasifikasi mengumpulkan atlet mengikut kesan kecacatan terhadap sukan mereka, dan semakan di temasya menekan kerana ia boleh mengubah siapa lawan mereka. Bantu atlet memahami proses (bersama doktor atau pengurus pasukan), beri usaha penuh yang jujur (salah nyata secara sengaja melanggar peraturan) dan bersedia untuk mana-mana keputusan.'));},
 pg_boost(L,a){return SQ(tr('Something an athlete heard','Sesuatu yang didengar atlet'),athCard(a,tr('spinal cord injury','kecederaan saraf tunjang'))+tbl([[tr('Athlete says','Kata atlet'),tr('"Someone said \'boosting\' makes you faster. Is that true?"','"Ada orang kata \'boosting\' buat kita lebih laju. Betul ke?"')]]),tr('How do you respond?','Bagaimana anda menjawab?'),
  tr('Explain it is dangerous and banned, and bring in the team doctor straight away','Terangkan ia berbahaya dan dilarang, dan libatkan doktor pasukan segera'),[tr('Say it is a personal choice and keep it confidential','Katakan ia pilihan peribadi dan rahsiakan'),tr('Tell them to ask the athletes who tried it','Suruh mereka tanya atlet yang pernah mencubanya'),tr('Change the subject so they forget about it','Tukar topik supaya mereka lupa tentangnya')],
  tr('"Boosting" means deliberately triggering autonomic dysreflexia, a sudden spike in blood pressure in some athletes with high spinal cord injuries. It can cause stroke or death and is prohibited in para sport. This is a safety issue, so involve the team doctor; confidentiality does not cover serious risk of harm.','"Boosting" bermaksud sengaja mencetuskan disrefleksia autonomik, lonjakan tekanan darah mendadak pada sesetengah atlet dengan kecederaan saraf tunjang tinggi. Ia boleh menyebabkan strok atau kematian dan dilarang dalam sukan para. Ini isu keselamatan, jadi libatkan doktor pasukan; kerahsiaan tidak meliputi risiko bahaya serius.'));},
 pg_vi(L,a){return SQ(tr('First day at the new venue','Hari pertama di venue baharu'),athCard(a,tr('visually impaired','cacat penglihatan'))+tbl([[tr('Situation','Situasi'),tr('Unfamiliar warm-up area, crowds, echoes','Kawasan memanaskan badan asing, orang ramai, gema')],[tr('Athlete says','Kata atlet'),tr('"I feel lost in here."','"Saya rasa sesat di sini."')]]),tr('How do you support them?','Bagaimana anda menyokong mereka?'),
  tr('Introduce yourself, offer your elbow, walk the route and describe the layout','Perkenalkan diri, tawarkan siku, jalani laluan dan terangkan susun atur'),[tr('Hold their arm and steer them quickly to their spot','Pegang lengan mereka dan pimpin cepat ke tempat mereka'),tr('Leave it to their guide; it isn\'t a psychology task','Serahkan kepada pemandu; ini bukan tugas psikologi'),tr('Rearrange their kit so everything is closer to them','Susun semula barang mereka supaya semuanya lebih dekat')],
  tr('Feeling oriented is part of feeling in control. Say who you are, ask before helping, offer an elbow rather than grabbing, describe the space and walk key routes early. Never move an athlete\'s equipment without telling them.','Rasa tahu arah ialah sebahagian rasa terkawal. Beritahu siapa anda, tanya sebelum membantu, tawarkan siku dan bukan menarik, terangkan ruang dan jalani laluan penting lebih awal. Jangan sesekali alihkan peralatan atlet tanpa memberitahu mereka.'));},
 pg_heat(L,a){return SQ(tr(`${live()}: hot venue, long wait`,`${live()}: venue panas, menunggu lama`),athCard(a,tr('high spinal cord injury','kecederaan saraf tunjang tinggi'))+tbl([[tr('Conditions','Keadaan'),tr('Outdoor, 33 °C, start delayed','Luar, 33 °C, permulaan ditangguh')],[tr('Athlete','Atlet'),tr('Flushed, says "I feel strange"','Muka merah, kata "Saya rasa pelik"')]]),tr('What happens now?','Apa yang berlaku sekarang?'),
  tr('Get them into shade and cooling now and call the team doctor','Bawa ke tempat teduh dan sejukkan sekarang, panggil doktor pasukan'),[tr('Keep them warm and focused for the start','Pastikan mereka panas dan fokus untuk bermula'),tr('A pep talk: push through, it\'s just nerves','Beri semangat: teruskan, itu cuma gemuruh'),tr('Wait to see if it passes before telling anyone','Tunggu sama ada ia hilang sebelum beritahu sesiapa')],
  tr('Many athletes with spinal cord injuries sweat little or not at all below the injury, so they overheat quickly. Cooling plans (shade, cooling vests, cold drinks) must be ready, and feeling unwell is a medical matter: act first, then reset mentally.','Ramai atlet dengan kecederaan saraf tunjang berpeluh sedikit atau tidak langsung di bawah paras kecederaan, jadi mereka cepat terlalu panas. Pelan penyejukan (teduh, jaket penyejuk, minuman sejuk) mesti sedia, dan rasa tidak sihat ialah urusan perubatan: bertindak dahulu, kemudian set semula mental.'));},
 pg_equip(L,a){return SQ(tr(`${live()}: wheelchair damaged in warm-up`,`${live()}: kerusi roda rosak semasa memanaskan badan`),athCard(a)+tbl([[tr('Problem','Masalah'),tr('Flat tyre, 20 minutes to start','Tayar pancit, 20 minit sebelum mula')],[tr('Athlete','Atlet'),tr('Panicking: "It\'s over."','Panik: "Habislah."')]]),tr('What is your part?','Apa peranan anda?'),
  tr('Calm the athlete with a reset routine while the technician fixes or swaps the chair','Tenangkan atlet dengan rutin set semula sementara juruteknik baiki atau tukar kerusi'),[tr('Try to fix the tyre yourself to save some time','Cuba baiki tayar sendiri untuk jimat masa'),tr('Agree it\'s over and start preparing a statement','Setuju sudah habis dan mula sediakan kenyataan'),tr('Ask other teams if anyone has a chair to lend','Tanya pasukan lain jika ada kerusi untuk dipinjam')],
  tr('Equipment is part of performance in para sport, so teams bring technicians and spares. The psychologist\'s job is the athlete: slow the breathing, shrink the problem to the next step and restart the warm-up routine once the chair is ready.','Peralatan ialah sebahagian prestasi dalam sukan para, jadi pasukan membawa juruteknik dan alat ganti. Tugas ahli psikologi ialah atlet: perlahankan pernafasan, kecilkan masalah kepada langkah seterusnya dan mulakan semula rutin memanaskan badan bila kerusi siap.'));},
 pg_media(L,a){return SQ(tr('After the final, a reporter asks','Selepas akhir, wartawan bertanya'),athCard(a)+tbl([[tr('Question','Soalan'),tr('"Tell us about the accident. Was it tragic?"','"Ceritakan tentang kemalangan itu. Adakah ia tragis?"')],[tr('Athlete','Atlet'),tr('Wants to talk about the race','Mahu bercakap tentang perlumbaan')]]),tr('How did you prepare them?','Bagaimana anda menyediakan mereka?'),
  tr('Agreed boundaries and a bridge line back to their performance','Sempadan yang dipersetujui dan ayat jambatan kembali kepada prestasi'),[tr('Answer every personal question to keep media friendly','Jawab setiap soalan peribadi supaya media mesra'),tr('Refuse all interviews after competing','Tolak semua temu bual selepas bertanding'),tr('Let the team manager answer on their behalf','Biar pengurus pasukan menjawab bagi pihak mereka')],
  tr('Para athletes are often asked about their impairment instead of their sport. Athletes decide what of their story to share. Agreeing boundaries and a short bridge line ("I\'d rather talk about the race…") before interviews keeps them in control.','Atlet para sering ditanya tentang kecacatan dan bukan sukan mereka. Atlet menentukan bahagian kisah yang mahu dikongsi. Bersetuju tentang sempadan dan ayat jambatan ringkas ("Saya lebih suka bercakap tentang perlumbaan…") sebelum temu bual memastikan mereka terkawal.'));},

function normLook(L){if(!L)return L;if(L.hair==='tudung'){L.hair='long';L.hairC=0;}if(typeof L.hairC==='number'&&L.hairC>=HAIRC.length)L.hairC=0;
  if(L.sex!=='m'&&L.sex!=='f')L.sex=(L.fem===true||(L.fem!==false&&['long','bob','bun','pony'].includes(L.hair)))?'f':'m';
  if(typeof L.ht!=='number')L.ht=1;if(typeof L.bd!=='number')L.bd=1;return L;}
function bodyDims(L){normLook(L);const f=L.sex==='f';let tw=f?.9:1.05,hw=f?1.06:.96,wa=f?.88:1,at=f?.92:1,lt=1;
  const B=[[.88,.94,.85,.88],[1,1,1,1],[1.13,1.1,1.12,1.12],[1.15,1,1.32,1.18]][L.bd]||[1,1,1,1];tw*=B[0];hw*=B[1];at*=B[2];lt*=B[3];
