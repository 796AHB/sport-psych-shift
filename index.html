<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sport Psych Shift</title>
<meta name="description" content="Sport psychology shift game: Open Day, Career ladder, Asian Games and Asian Para Games seasons.">
<meta name="theme-color" content="#7a5a8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sport Psych">
<script>window.PWA_BUILD=true;</script>
<style>html,body{margin:0;padding:0}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=DM+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: full-bleed 3D canvas; cream outlined panels float over it (stat card top-left, buttons + minimap top-right, act button bottom-right, joystick bottom-left). One committed daylight look. */
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:light;
  --cream:#f6f1e3; --cream2:#ece5d2; --ink:#1d2321; --mute:#56605c; --shadow:rgba(29,35,33,.32);
  --mustard:#ecc246; --pink:#f2a3c4; --hot:#e8577a; --teal:#4fa89b; --orange:#e9884a; --blue:#5b93cf; --mint:#d6efe6; --red:#d24b45;
  --px:'Silkscreen','Courier New',monospace; --body:'DM Sans',system-ui,sans-serif;
}
html,body{height:100%}
body{background:#9fc3cf;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;margin:0}
#app{position:fixed;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#touch{position:absolute;inset:0;touch-action:none}
button{font-family:var(--body);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.panel{background:var(--cream);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--shadow)}
.pbtn{background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--shadow);font-weight:800;font-size:clamp(14px,2.2vw,18px);padding:10px 16px;display:inline-flex;align-items:center;gap:8px;transition:transform .06s}
.pbtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.pbtn.y{background:var(--mustard)} .pbtn.pk{background:var(--pink)} .pbtn.mt{background:var(--mint)}
.pbtn:disabled{opacity:.45;pointer-events:none}
.pbtn .pill{border:2px solid var(--ink);border-radius:999px;padding:1px 9px;background:var(--mint);font-size:.85em}
.eyebrow{font:400 clamp(11px,1.6vw,14px) var(--px);color:var(--teal);letter-spacing:.06em;text-transform:uppercase}
.ptitle{font:700 clamp(20px,3.6vw,34px)/1.15 var(--px);margin:6px 0 10px;text-wrap:balance}
p{margin:0;line-height:1.5}
.mute{color:var(--mute)}

/* ---------- screens ---------- */
#ui{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
#ui[hidden]{display:none!important}
#ui.dim{background:rgba(29,35,33,.35)}
.scr{width:min(980px,100%);max-height:100%;overflow-y:auto;padding:clamp(16px,3vw,28px);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.5}}
.scr.bare{background:none;border:0;box-shadow:none;padding:0;overflow:visible;max-height:none}
.toprow{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.btnrow{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.title{width:min(1000px,100%);display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.logo{position:relative;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.logo h1{margin:0;font:700 clamp(46px,10vw,104px)/.9 var(--px);color:var(--pink);-webkit-text-stroke:3px var(--ink);text-shadow:5px 5px 0 var(--ink);letter-spacing:-.02em}
.logo h1 span{color:#fff}
.sticker{background:var(--pink);border:3px solid var(--ink);border-radius:8px;padding:4px 10px;font:700 clamp(11px,1.8vw,15px)/1.1 var(--px);transform:rotate(-8deg);box-shadow:3px 3px 0 var(--ink);text-align:center;margin-bottom:14px}
.sticker small{display:block;font-size:.7em;font-weight:400}
.tagline{font:400 clamp(12px,1.9vw,17px) var(--px);color:#fff;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);text-transform:uppercase;max-width:62ch}
.startrow{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch}
.bigstart{font:700 clamp(28px,5.6vw,52px) var(--px);background:var(--mustard);border:4px solid var(--ink);border-radius:20px;padding:8px clamp(30px,8vw,90px);box-shadow:6px 6px 0 var(--ink);letter-spacing:.1em}
.bigstart:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.cont{background:var(--mint);border:3px solid var(--ink);border-radius:16px;padding:10px 18px;font-weight:800;font-size:clamp(14px,2.2vw,19px);box-shadow:4px 4px 0 var(--shadow);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.cont small{font-weight:600;color:var(--mute)}
.explore{display:flex;align-items:center;gap:14px;padding:10px 14px;align-self:flex-end}
.explore b{font:700 clamp(14px,2vw,18px) var(--px);display:block}
.explore small{font-weight:600;color:var(--mute)}
.tog{width:64px;height:34px;border-radius:999px;border:3px solid var(--ink);background:var(--cream2);position:relative;flex:none}
.tog i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.tog.on{background:var(--teal)} .tog.on i{left:31px}
.fine{font-size:13px;color:#fff;text-shadow:1px 1px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);font-weight:600}
.ver{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 8px;background:var(--cream);color:var(--ink);text-shadow:none;font:700 12px var(--px);margin-left:6px}
.hdr{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.back{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:var(--cream);box-shadow:3px 3px 0 var(--shadow);font-size:22px;flex:none}
.hdr .k{font:700 clamp(12px,1.8vw,16px) var(--px);color:var(--mustard);text-shadow:1px 1px 0 var(--ink);display:block}
.hdr .h{font:700 clamp(24px,5vw,50px)/1 var(--px);color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.pcard{text-align:left;padding:16px 18px;display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.pcard:active{transform:translate(3px,3px)}
.pcard b{font:700 clamp(18px,2.8vw,26px)/1.1 var(--px)}
.pcard .s{font:400 clamp(13px,1.9vw,17px)/1.3 var(--px);color:var(--red);text-transform:uppercase}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px;background:var(--cream)}
.chip.mt{background:var(--mint)} .chip.pk{background:#f6cfd8} .chip.y{background:#f7dd8f}
.diff{text-align:left;padding:16px 18px;display:flex;flex-direction:column;gap:8px;position:relative;min-height:140px;min-width:0}
.diff b{font:700 clamp(18px,2.6vw,24px) var(--px)}
.diff.easy{background:var(--cream2);color:#8d918f;pointer-events:none}
.diff.easy b,.diff.easy p{text-decoration:line-through}
.diff.hard{background:#f7e4e4} .diff.hard b{color:var(--red)}
.stamp{position:absolute;left:16%;top:46%;transform:rotate(-14deg);border:4px solid var(--red);color:var(--red);font:700 clamp(18px,3vw,28px) var(--px);padding:2px 14px;border-radius:8px;background:rgba(246,207,216,.7)}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.tip{border:3px solid var(--ink);border-radius:14px;padding:12px 14px;font:800 13px/1.7 var(--body);text-transform:uppercase;color:var(--mute);background:#fff}
.tip .ic{display:block;margin-bottom:6px;color:var(--ink)}
.ctrl{font-size:14px;color:var(--mute)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-size:16px;max-width:520px}
.kv b{text-align:right;font-variant-numeric:tabular-nums}
.bigstars{font:700 clamp(36px,7vw,60px) var(--px);color:var(--mustard);-webkit-text-stroke:2px var(--ink);letter-spacing:.1em}
.joblist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.jrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;background:#fff}
.jrow.tr{background:#fbefc2}
.jrow .t{font-weight:800;font-size:15px;line-height:1.25;min-width:0}
.jrow .t small{display:block;font-weight:500;color:var(--mute)}
.pri{font:700 11px var(--px);border:2px solid var(--ink);border-radius:6px;padding:2px 6px;text-align:center;min-width:64px}
.pri.HOT{background:var(--hot);color:#fff} .pri.SOON{background:var(--mustard)} .pri.ROUTINE{background:var(--mint)} .pri.BAG{background:var(--pink)}
.late{color:var(--red);font-weight:800}
.choice{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.choice .pbtn{justify-content:space-between;text-align:left}
.lockgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.lk{padding:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left}
.lk.on{background:#fbefc2}
.sw{width:100%;height:34px;border:2px solid var(--ink);border-radius:8px;display:block}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
#hud[hidden]{display:none!important}
#hud>*{pointer-events:auto}
.stat{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));width:min(310px,58vw);padding:12px 14px;transform-origin:top left}
.stat .clk{display:flex;align-items:baseline;gap:8px}
.stat .clk b{font:700 clamp(28px,4.6vw,42px)/1 var(--px);font-variant-numeric:tabular-nums}
.stat .clk small{font:700 14px var(--px);color:var(--mute)}
.phase{font:700 clamp(12px,1.8vw,16px) var(--px);color:var(--teal);margin-top:4px}
.closing{display:flex;justify-content:space-between;align-items:center;font:700 12px var(--body);letter-spacing:.04em;margin-top:6px;gap:6px}
.closing .st{font-size:18px;letter-spacing:1px;color:#d8d2bf;-webkit-text-stroke:1px var(--ink)}
.closing .st i{font-style:normal;color:var(--mustard)}
.prog{position:relative;height:12px;border:2.5px solid var(--ink);border-radius:9px;margin:6px 0 8px;background:repeating-linear-gradient(-45deg,#fff 0 5px,#f1e9d6 5px 10px);overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--red);min-width:10px}
.needs{display:grid;grid-template-columns:auto 1fr 34px;gap:5px 8px;align-items:center;font:700 12px var(--body);letter-spacing:.05em}
.needs .lb{display:flex;align-items:center;gap:6px;color:var(--mute);white-space:nowrap}
.needs svg{width:16px;height:16px;fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nb{height:12px;border:2.5px solid var(--ink);border-radius:7px;overflow:hidden;background:repeating-linear-gradient(-45deg,#fff 0 4px,#ece5d2 4px 8px)}
.nb i{display:block;height:100%;transition:width .3s}
.needs .v{font:700 13px var(--px);text-align:right;font-variant-numeric:tabular-nums}
.ate{margin-top:10px;display:inline-flex;gap:6px;align-items:center;border:2.5px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;background:#fff}
.colbtn{position:absolute;right:-14px;top:-14px;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);background:var(--cream);font-weight:900;font-size:18px;line-height:1}
.stat.min .hidemin{display:none}
.topright{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:10px}
.sq{width:56px;height:56px;border:3px solid var(--ink);border-radius:14px;background:var(--cream);box-shadow:4px 4px 0 var(--shadow);display:grid;place-items:center;position:relative}
.sq svg{width:26px;height:26px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sq:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.badge{position:absolute;top:-10px;right:-10px;min-width:26px;height:26px;border-radius:13px;background:var(--red);color:#fff;border:2px solid #fff;font:700 13px var(--px);display:grid;place-items:center;padding:0 4px}
.badge.zero{display:none}
#mini{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(78px + env(safe-area-inset-top,0px));width:clamp(96px,16vw,136px);height:clamp(96px,16vw,136px);border-radius:50%;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);background:#a8c69a;pointer-events:none}
.leftbtns{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:flex-end}
#phoneBtn{background:var(--pink);width:64px;height:64px}
#phoneBtn.ring{animation:ring .25s infinite}
@keyframes ring{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
#phoneBtn .cd{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font:700 11px var(--px);background:var(--ink);color:#fff;border-radius:6px;padding:0 5px}
#actBtn{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:clamp(112px,17vw,150px);height:clamp(112px,17vw,150px);border-radius:50%;border:4px solid var(--ink);background:var(--mustard);box-shadow:0 0 0 4px rgba(88,200,255,.55),0 0 22px rgba(88,200,255,.65),5px 5px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 clamp(12px,1.7vw,15px)/1.1 var(--px);text-align:center;padding:10px;touch-action:none}
#actBtn[hidden]{display:none}
#actBtn.dis{background:var(--cream2);color:var(--mute)}
#actBtn svg.ring{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);transform:rotate(-90deg);pointer-events:none}
#actBtn svg.ring circle{fill:none;stroke:var(--teal);stroke-width:8;stroke-dasharray:301.6;stroke-dashoffset:301.6}
#actBtn small{font:600 10px var(--body);opacity:.75;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#actBtn .ico{width:30px;height:30px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.track{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:6px 14px;font-weight:700;font-size:13px;max-width:min(46vw,420px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:12px;pointer-events:none}
.track .pri{display:inline-block;min-width:0;margin-right:6px;vertical-align:1px}
#say{position:absolute;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(40vw,460px)}
.bub{background:rgba(246,241,227,.95);border:2.5px solid var(--ink);border-radius:12px;padding:6px 12px;font:400 13px/1.35 var(--px);text-transform:uppercase;animation:bub 3.6s forwards;box-shadow:3px 3px 0 var(--shadow);text-align:center}
.bub b{display:block;font:700 11px var(--body);text-transform:none;color:var(--teal)}
.bub.bad b{color:var(--red)}
@keyframes bub{0%{opacity:0;transform:translateY(-8px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid rgba(29,35,33,.6);background:rgba(246,241,227,.35);pointer-events:none;display:none;transform:translate(-50%,-50%);z-index:11}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--cream);border:3px solid var(--ink)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.bang{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-5deg);font:700 clamp(30px,7vw,64px) var(--px);color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);white-space:nowrap;animation:bang 1s ease-out forwards}
.bang.r{color:var(--hot)} .bang.y{color:var(--mustard)}
@keyframes bang{0%{transform:translate(-50%,-50%) rotate(-5deg) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) rotate(-5deg) scale(1.1);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-80%) rotate(-5deg);opacity:0}}
.flt{position:absolute;font:700 18px var(--px);color:var(--ink);background:var(--mustard);border:2px solid var(--ink);border-radius:8px;padding:1px 8px;animation:flt 1.2s ease-out forwards;white-space:nowrap}
@keyframes flt{to{transform:translateY(-70px);opacity:0}}
.vign{position:absolute;inset:0;pointer-events:none!important;transition:box-shadow .4s}
.conf{position:absolute;top:-12px;width:9px;height:14px;border:1.5px solid var(--ink);animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg)}}
@media (max-height:520px) and (orientation:landscape){.stat{transform:scale(.8)} #mini{top:72px}}
@media (orientation:portrait){.stat{transform:scale(.84)} .track{bottom:calc(150px + env(safe-area-inset-bottom,0px));max-width:80vw} #say{top:auto;bottom:calc(196px + env(safe-area-inset-bottom,0px));width:86vw}}
@media (orientation:landscape){#say{top:auto;bottom:calc(52px + env(safe-area-inset-bottom,0px));width:min(36vw,380px)}}
.dock{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:16px;bottom:16px;width:min(480px,54vw);display:flex;flex-direction:column;padding:16px 18px;animation:pop .18s ease-out}
.lbody{flex:1;overflow-y:auto;min-height:0;padding-right:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:2.5px solid var(--ink);border-radius:999px;background:#fff;font-weight:800;font-size:13px;padding:5px 12px}
.tab.on{background:var(--mustard)}
.sws{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.swc{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);padding:0}
.swc.on{outline:3px solid var(--hot);outline-offset:2px}
#rotate{position:fixed;inset:0;z-index:50;background:var(--mustard);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#rotate[hidden]{display:none!important}
#rotate .ph{width:70px;height:120px;border:5px solid var(--ink);border-radius:16px;background:var(--cream);animation:rot 2.2s ease-in-out infinite;box-shadow:5px 5px 0 var(--shadow)}
@keyframes rot{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
#rotate b{font:700 26px/1.2 var(--px)}
#rotate button{background:none;border:0;text-decoration:underline;font-weight:700;font-size:15px}
@media (orientation:portrait){.dock{left:16px;right:16px;width:auto;top:44%;bottom:max(16px,env(safe-area-inset-bottom,0px))}}
@media (max-height:520px){.dock .ptitle{display:none} .dock{top:10px;bottom:10px;padding:10px 14px} .dock .lockgrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin:6px 0} .dock .lk{padding:6px 8px} .tab{padding:3px 10px;font-size:12px} .tabs{margin-bottom:6px} .swc{width:28px;height:28px} .dock .btnrow{margin-top:6px!important}}
.dvhint{flex:1;min-width:180px;color:#fff;font-weight:700;font-size:13px;text-shadow:1px 1px 0 var(--ink)}
.dvr{width:min(560px,100%);max-height:100%;overflow-y:auto;padding:18px}
/* roomier landscape */
#ui{align-items:flex-start!important;justify-content:flex-start!important}
#ui>*{margin:auto}
@media (orientation:landscape) and (max-height:600px){
 .logo h1{font-size:min(7.5vw,13vh);text-shadow:4px 4px 0 var(--ink)} .logo h1 br{display:none} .logo h1 span{margin-left:.3em}
 .sticker{font-size:11px;margin-bottom:6px}
 .title{gap:10px;width:min(1000px,100%)}

  g+=`<polygon points="${ideal.map((v,i)=>P(i,v).join(',')).join(' ')}" fill="rgba(122,90,140,.12)" stroke="#7a5a8c" stroke-dasharray="5 4" stroke-width="2"/>`;
  g+=`<polygon points="${cur.map((v,i)=>P(i,v).join(',')).join(' ')}" fill="rgba(226,85,63,.2)" stroke="#e2553f" stroke-width="2.5"/>`+cur.map((v,i)=>{const [x,y]=P(i,v);return `<circle cx="${x}" cy="${y}" r="3.5" fill="#e2553f" stroke="#1d2321"/>`;}).join('');
  g+=`<text x="8" y="${H-6}" font-size="10" fill="#e2553f">● ${tr('Current','Semasa')}</text><text x="90" y="${H-6}" font-size="10" fill="#7a5a8c">- - ${tr('Ideal','Ideal')}</text>`;

   learn:tr(`Heart-rate variability reflects autonomic balance and drops with accumulated stress — training, poor sleep, illness or worry. Look for sustained changes against the athlete's own baseline (rolling averages), not single days, and always combine it with what the athlete tells you.`,
     `Kebolehubahan kadar nadi mencerminkan keseimbangan autonomik dan menurun apabila tekanan terkumpul — latihan, tidur lemah, sakit atau kerisauan. Cari perubahan berterusan berbanding garis dasar atlet sendiri (purata bergerak), bukan satu hari sahaja, dan sentiasa gabungkan dengan apa yang atlet beritahu.`)};},
 smart(L,a){const c=tr('Raise first-serve accuracy from 62% to 70% in match play within 8 weeks, tracked weekly by video','Naikkan ketepatan servis pertama daripada 62% ke 70% dalam perlawanan dalam 8 minggu, dijejak setiap minggu melalui video');
  return {title:tr('Goal-setting session','Sesi penetapan matlamat'),data:athCard(a)+tbl([[tr('Current','Semasa'),tr('First-serve accuracy 62%','Ketepatan servis pertama 62%')],[tr('Event','Acara'),tr('National trials in 8 weeks','Pemilihan kebangsaan dalam 8 minggu')]]),q:tr('Which is the best-written goal?','Matlamat manakah ditulis paling baik?'),
   ...mkOpts(c,[tr('Serve better','Servis dengan lebih baik'),tr('Win the trials','Menang pemilihan'),tr('Never miss a serve again','Tidak pernah tersilap servis lagi')]),
   learn:tr(`SMART: Specific, Measurable, Achievable, Relevant, Time-bound. Good goals also have a review point and are written with the athlete, not for them. Write them down and revisit them weekly.`,
     `SMART: Spesifik, boleh diukur (Measurable), boleh dicapai (Achievable), Relevan, berTempoh masa. Matlamat yang baik juga ada titik semakan dan ditulis bersama atlet, bukan untuk mereka. Tulis dan semak setiap minggu.`)};},
 goaltypes(L,a){const items=[[tr('Win a medal at the SEA Games','Menang pingat di Sukan SEA'),'o'],[tr('Run 10.45 s in the 100 m','Lari 10.45 s dalam 100 m'),'p'],[tr('Drive the knees in the first five steps','Angkat lutut dengan kuat dalam lima langkah pertama'),'pr']];const k=pick(items);const nm={o:tr('Outcome goal','Matlamat hasil'),p:tr('Performance goal','Matlamat prestasi'),pr:tr('Process goal','Matlamat proses')};
  return {title:tr('Sort the goals','Kelaskan matlamat'),data:athCard(a)+tbl(items.map(i=>[i[0],i===k?'<b>?</b>':nm[i[1]]]),[tr('Goal','Matlamat'),tr('Type','Jenis')]),q:tr(`What type of goal is "${k[0]}"?`,`Apakah jenis matlamat "${k[0]}"?`),...mkOpts(nm[k[1]],Object.values(nm).filter(x=>x!==nm[k[1]]).concat([tr('Dream goal','Matlamat impian')])),
   learn:tr(`Outcome goals depend on others (medals, rankings); performance goals compare against your own standard (times, percentages); process goals are the actions that produce performance (technique cues). Process goals are the most controllable, so they anchor attention under pressure.`,
     `Matlamat hasil bergantung pada orang lain (pingat, kedudukan); matlamat prestasi dibandingkan dengan standard sendiri (masa, peratus); matlamat proses ialah tindakan yang menghasilkan prestasi (isyarat teknik). Matlamat proses paling boleh dikawal, jadi ia menambat tumpuan ketika tertekan.`)};},
 routine(L,a){const c=tr('Same sequence every time: settle the breath, check grip, one cue word, quick image, go','Urutan yang sama setiap kali: tenangkan nafas, semak genggaman, satu kata isyarat, imej ringkas, mula');
  return {title:tr('Build a pre-performance routine','Bina rutin pra-persembahan'),data:athCard(a)+tbl([[tr('Issue','Isu'),tr('Rushes under pressure','Tergesa-gesa bila tertekan')],[tr('Training','Latihan'),tr('Fine when relaxed','Baik bila tenang')]]),q:tr('What routine do you build?','Rutin apakah yang anda bina?'),
   ...mkOpts(c,[tr('Change the routine every match to keep it fresh','Tukar rutin setiap perlawanan supaya segar'),tr('Go as fast as possible to avoid thinking','Buat secepat mungkin supaya tak sempat berfikir'),tr('Think about the score before every attempt','Fikirkan skor sebelum setiap percubaan')]),
   learn:tr(`Pre-performance routines give attention a consistent job, regulate arousal and help reset after errors. Keep them short, consistent in timing, and practised in training until automatic.`,
     `Rutin pra-persembahan memberi tumpuan satu tugas yang konsisten, mengawal arousal dan membantu bangkit semula selepas kesilapan. Pastikan ia ringkas, konsisten masanya dan dilatih sehingga menjadi automatik.`)};},
 selftalk(L,a){const prec=Math.random()<.5,sp=prec?tr('a free-throw style precision task','tugasan ketepatan seperti balingan bebas'):tr('the last 200 m of a cycling sprint','200 m terakhir pecut berbasikal');
  const I=tr('Instructional self-talk: "smooth release"','Bual diri arahan: "lepas dengan lancar"'),Mo=tr('Motivational self-talk: "drive, drive, drive"','Bual diri motivasi: "pecut, pecut, pecut"');
  return {title:tr('Choose the self-talk','Pilih bual diri'),data:athCard(a)+tbl([[tr('Moment','Saat'),sp],[tr('Current inner voice','Suara dalaman semasa'),tr('"Don\'t mess this up"','"Jangan rosakkan"')]]),q:tr('Which self-talk fits this moment best?','Bual diri manakah paling sesuai untuk saat ini?'),
   ...mkOpts(prec?I:Mo,[prec?Mo:I,tr('Negative self-talk to stay humble','Bual diri negatif supaya rendah diri'),tr('No inner voice at all','Tiada suara dalaman langsung')]),
   learn:tr(`Instructional self-talk (technique cues) tends to help fine, precise skills; motivational self-talk (effort, energy) helps strength and endurance tasks. Short, positive, first-person or second-person cues that the athlete chooses and rehearses work best. Replace "don't" statements with what to do.`,
     `Bual diri arahan (isyarat teknik) cenderung membantu kemahiran halus dan tepat; bual diri motivasi (usaha, tenaga) membantu tugasan kekuatan dan ketahanan. Isyarat ringkas dan positif yang dipilih serta dilatih oleh atlet paling berkesan. Gantikan ayat "jangan" dengan apa yang perlu dibuat.`)};},
 imagery(L,a){const c=tr('In competition kit, in the real venue, at real speed, including crowd noise and the nerves they actually feel','Dengan pakaian pertandingan, di venue sebenar, pada kelajuan sebenar, termasuk bunyi penonton dan debaran yang sebenar dirasai');
  return {title:tr('Write an imagery script','Tulis skrip imageri'),data:athCard(a)+tbl([[tr('Goal','Matlamat'),tr('Rehearse the decisive moment','Latih detik penentuan')],[tr('Model','Model'),'PETTLEP']]),q:tr('Which script follows PETTLEP best?','Skrip manakah paling mengikut PETTLEP?'),
   ...mkOpts(c,[tr('Lying in bed, in slow motion, feeling totally calm','Berbaring di katil, gerak perlahan, rasa sangat tenang'),tr('Watching someone else on YouTube','Menonton orang lain di YouTube'),tr('Imagining the medal ceremony only','Membayangkan upacara pingat sahaja')]),
   learn:tr(`PETTLEP: Physical, Environment, Task, Timing, Learning, Emotion, Perspective. Imagery works best when it closely matches the real situation and is updated as skills develop. Short, frequent sessions beat one long session.`,
     `PETTLEP: Fizikal, Persekitaran, Tugasan, Masa, Pembelajaran, Emosi, Perspektif. Imageri paling berkesan apabila ia hampir sama dengan situasi sebenar dan dikemas kini apabila kemahiran berkembang. Sesi ringkas dan kerap lebih baik daripada satu sesi panjang.`)};},
 arousal(L,a){const lowT=Math.random()<.5,sp=lowT?tr('Shooting','Menembak'):tr('Weightlifting','Angkat berat'),A=tr('Lower arousal: slow breathing (exhale longer than inhale), routine, one process cue','Turunkan arousal: pernafasan perlahan (hembus lebih lama daripada tarik), rutin, satu isyarat proses'),B=tr('Psych up: energising music, power words, dynamic warm-up','Naikkan semangat: muzik bertenaga, kata kuasa, memanaskan badan dinamik');
  return {title:tr(`${sp}: watching the warm-up`,`${sp}: memerhati sesi memanaskan badan`),data:athCard(a)+tbl([[tr('Task','Tugasan'),lowT?tr('Fine motor control, steady aim','Kawalan motor halus, bidikan stabil'):tr('Maximal force, explosive','Daya maksimum, eksplosif')],[tr('Observation','Pemerhatian'),lowT?tr('Heart racing, hands shaky, rushing','Jantung berdebar, tangan menggigil, tergesa-gesa'):tr('Flat, yawning, slow warm-up','Lesu, menguap, memanaskan badan perlahan')]]),q:tr('What does this athlete need?','Apa yang atlet ini perlukan?'),
   ...mkOpts(lowT?A:B,[lowT?B:A,tr('Nothing: arousal does not affect performance','Tiada: arousal tidak menjejaskan prestasi'),tr('Maximum arousal for every athlete','Arousal maksimum untuk semua atlet')]),
   learn:tr(`Inverted-U: performance peaks at a moderate arousal that depends on the task. Fine, precise skills need lower arousal; gross, maximal skills tolerate more. A longer exhale than inhale calms; fast music and power words energise.`,
     `U terbalik: prestasi memuncak pada arousal sederhana yang bergantung pada tugasan. Kemahiran halus dan tepat memerlukan arousal lebih rendah; kemahiran kasar dan maksimum boleh menerima lebih tinggi. Hembusan lebih panjang daripada tarikan menenangkan; muzik pantas dan kata kuasa memberi tenaga.`)};},
 izof(L,a){const best=[ri(4,5),ri(6,7)],now=Math.random()<.5?ri(8,9):ri(1,3),hi=now>best[1];
  const A=tr('Above their zone: calming strategies (breathing, routine) before the start','Melebihi zon: strategi menenangkan (pernafasan, rutin) sebelum mula'),B=tr('Below their zone: energising strategies (music, cue words, dynamic warm-up)','Di bawah zon: strategi memberi tenaga (muzik, kata isyarat, memanaskan badan dinamik)');
  return {title:tr('Individual zone of optimal functioning','Zon fungsi optimum individu'),data:athCard(a)+tbl([[tr('Best performances recalled at anxiety','Prestasi terbaik diingati pada kebimbangan'),`${best[0]}–${best[1]} / 10`],[tr('Rating 30 min before today\'s final','Penilaian 30 min sebelum perlawanan akhir hari ini'),now+' / 10']]),q:tr('What do you do?','Apa tindakan anda?'),
   ...mkOpts(hi?A:B,[hi?B:A,tr('Nothing: every athlete should be at 5/10','Tiada: semua atlet patut berada pada 5/10'),tr('Ask them to suppress all emotion','Minta mereka tahan semua emosi')]),
   learn:tr(`IZOF (Hanin): each athlete has their own optimal range of anxiety and emotion, found by recalling best and worst performances. Coaching moves the athlete into their zone, which may be high for one person and low for another.`,
     `IZOF (Hanin): setiap atlet mempunyai julat optimum kebimbangan dan emosi tersendiri, ditemui dengan mengingati prestasi terbaik dan terburuk. Bimbingan membawa atlet ke dalam zon mereka, yang mungkin tinggi bagi seorang dan rendah bagi yang lain.`)};},
 nideffer(L,a){const S=[[tr('Reading the whole field to choose a pass','Membaca keseluruhan padang untuk memilih hantaran'),tr('Broad-external','Luas-luaran')],[tr('Analysing match video to plan tactics','Menganalisis video perlawanan untuk merancang taktik'),tr('Broad-internal','Luas-dalaman')],[tr('Focusing on the target at the moment of release','Fokus pada sasaran ketika melepaskan'),tr('Narrow-external','Sempit-luaran')],[tr('Scanning your body for tension before a lift','Mengimbas badan untuk ketegangan sebelum angkatan'),tr('Narrow-internal','Sempit-dalaman')]];const k=pick(S);
  return {title:tr('Match the attentional focus','Padankan fokus perhatian'),data:athCard(a)+tbl([[tr('Width','Lebar'),tr('Broad ↔ Narrow','Luas ↔ Sempit')],[tr('Direction','Arah'),tr('External ↔ Internal','Luaran ↔ Dalaman')]]),q:tr(`Which attentional style does this need: "${k[0]}"?`,`Gaya tumpuan manakah diperlukan: "${k[0]}"?`),...mkOpts(k[1],S.map(s=>s[1]).filter(x=>x!==k[1])),
   learn:tr(`Nideffer's model crosses width (broad/narrow) with direction (external/internal). Good performers shift between styles as the situation changes. Problems arise when attention gets stuck in the wrong box, e.g. narrow-internal worry while needing narrow-external focus on the target.`,
     `Model Nideffer menggabungkan lebar (luas/sempit) dengan arah (luaran/dalaman). Atlet yang baik beralih antara gaya mengikut situasi. Masalah timbul apabila tumpuan tersekat di kotak yang salah, contohnya risau sempit-dalaman ketika perlu fokus sempit-luaran pada sasaran.`)};},
 choking(L,a){const c=tr('Give one holistic cue or rhythm word and practise under simulated pressure','Beri satu isyarat menyeluruh atau kata irama dan berlatih dalam tekanan simulasi');
  return {title:tr('Missed putts on the final end','Gagal pada percubaan terakhir'),data:athCard(a)+tbl([[tr('Pattern','Corak'),tr('Fine in training, falls apart in finals','Baik semasa latihan, gagal pada perlawanan akhir')],[tr('Athlete says','Kata atlet'),tr('"I start checking every part of my technique."','"Saya mula semak setiap bahagian teknik saya."')]]),q:tr('What is the best approach?','Apakah pendekatan terbaik?'),
   ...mkOpts(c,[tr('Give a detailed technical checklist to think through','Beri senarai semak teknikal terperinci untuk difikirkan'),tr('Tell them to try harder in finals','Suruh mereka berusaha lebih kuat pada perlawanan akhir'),tr('Avoid pressure situations in training','Elakkan situasi tekanan semasa latihan')]),
   learn:tr(`Choking often comes from explicit monitoring: under pressure, experts start consciously controlling automatic skills. Holistic cue words, analogies, pre-performance routines and regular practice under pressure keep the skill automatic.`,
     `Tersekat (choking) sering berpunca daripada pemantauan eksplisit: bila tertekan, atlet mahir mula mengawal secara sedar kemahiran yang sepatutnya automatik. Kata isyarat menyeluruh, analogi, rutin pra-persembahan dan latihan berkala dalam tekanan mengekalkan kemahiran secara automatik.`)};},
 bandura(L,a){const c=tr('Performance accomplishments: break the skill into steps they can succeed at','Pencapaian prestasi: pecahkan kemahiran kepada langkah yang mereka boleh berjaya');
  return {title:tr('Rebuilding confidence','Membina semula keyakinan'),data:athCard(a)+tbl([[tr('Situation','Situasi'),tr('Lost confidence in a new dive after a bad landing','Hilang keyakinan pada terjunan baharu selepas mendarat dengan teruk')],[tr('Sources (Bandura)','Sumber (Bandura)'),tr('Accomplishments · vicarious · verbal persuasion · physiological states','Pencapaian · pemerhatian · pujukan lisan · keadaan fisiologi')]]),q:tr('Which source of self-efficacy is the strongest to use first?','Sumber efikasi kendiri manakah paling kuat untuk digunakan dahulu?'),
   ...mkOpts(c,[tr('Verbal persuasion: tell them repeatedly they can do it','Pujukan lisan: beritahu berulang kali mereka boleh'),tr('Vicarious: show a video of a world champion','Pemerhatian: tunjuk video juara dunia'),tr('Physiological: tell them nerves mean they are weak','Fisiologi: beritahu gemuruh bermakna mereka lemah')]),
   learn:tr(`Self-efficacy (Bandura) comes from four sources; past performance accomplishments are the most powerful, followed by vicarious experience (ideally a similar peer), verbal persuasion, and how physiological states are interpreted. Progressions that guarantee small wins rebuild belief fastest.`,
     `Efikasi kendiri (Bandura) datang daripada empat sumber; pencapaian prestasi lalu paling berkuasa, diikuti pengalaman pemerhatian (sebaiknya rakan setara), pujukan lisan, dan cara keadaan fisiologi ditafsir. Progresi yang menjamin kejayaan kecil membina semula keyakinan paling cepat.`)};},
 sdt(L,a){const c=tr('Offer choices within the session, explain the why, and give specific feedback on progress','Beri pilihan dalam sesi, terangkan sebabnya, dan beri maklum balas spesifik tentang kemajuan');
  return {title:tr('Motivation is dropping','Motivasi semakin menurun'),data:athCard(a)+tbl([[tr('Coach style','Gaya jurulatih'),tr('Controlling: "Because I said so"','Mengawal: "Sebab saya cakap begitu"')],[tr('Athlete says','Kata atlet'),tr('"I only train so I don\'t get shouted at."','"Saya berlatih supaya tak kena marah saja."')]]),q:tr('What would you suggest to the coach?','Apa cadangan anda kepada jurulatih?'),
   ...mkOpts(c,[tr('Add cash rewards for every session','Tambah ganjaran wang untuk setiap sesi'),tr('More punishment for missed sessions','Lebih hukuman untuk sesi yang ponteng'),tr('Compare athletes publicly to create rivalry','Bandingkan atlet secara terbuka untuk mencipta persaingan')]),
   learn:tr(`Self-determination theory: autonomy, competence and relatedness fuel self-determined motivation, which is linked to persistence, enjoyment and wellbeing. Controlling styles shift athletes toward external reasons ("so I don't get shouted at"), which predict dropout and burnout.`,
     `Teori penentuan kendiri: autonomi, kecekapan dan perhubungan menyuburkan motivasi kendiri, yang dikaitkan dengan ketabahan, keseronokan dan kesejahteraan. Gaya mengawal menolak atlet ke arah sebab luaran ("supaya tak kena marah"), yang meramalkan berhenti bersukan dan burnout.`)};},
 attrib(L,a){const c=tr('"My first serve dropped in the third set; we can train serving when tired."','"Servis pertama saya merosot pada set ketiga; kita boleh latih servis ketika letih."');
  return {title:tr('After a close loss','Selepas kalah tipis'),data:athCard(a)+tbl([[tr('Athlete says','Kata atlet'),tr('"I\'m just not talented enough. I always lose the big ones."','"Saya memang tak berbakat. Saya selalu kalah perlawanan besar."')],[tr('Attribution','Atribusi'),tr('Internal, stable, uncontrollable','Dalaman, stabil, tidak boleh dikawal')]]),q:tr('Which reframe is most helpful?','Pentafsiran semula manakah paling membantu?'),
   ...mkOpts(c,[tr('"The referee cost you the match."','"Pengadil yang buat awak kalah."'),tr('"You were just unlucky today."','"Awak cuma tak bernasib baik hari ini."'),tr('"Yes, maybe this sport isn\'t for you."','"Ya, mungkin sukan ini bukan untuk awak."')]),
   learn:tr(`Attributions that are internal but unstable and controllable (effort, strategy, a specific skill) keep motivation alive because they point to something to work on. Stable, uncontrollable causes ("no talent") lead to helplessness; purely external blame stops learning.`,
     `Atribusi yang dalaman tetapi tidak stabil dan boleh dikawal (usaha, strategi, kemahiran tertentu) mengekalkan motivasi kerana ia menunjukkan sesuatu untuk diperbaiki. Punca stabil dan tidak boleh dikawal ("tiada bakat") membawa kepada rasa tidak berdaya; menyalahkan faktor luaran semata-mata menghentikan pembelajaran.`)};},
 cohesion(L,a){const c=tr('Clarify roles and build shared team goals in a facilitated session','Jelaskan peranan dan bina matlamat pasukan bersama dalam sesi berfasilitator');
  return {title:tr('Hockey squad split into cliques','Skuad hoki berpecah kepada kumpulan kecil'),data:athCard(a)+tbl([[tr('Social cohesion','Kesepaduan sosial'),tr('Low: groups by club','Rendah: berkumpul ikut kelab')],[tr('Task cohesion','Kesepaduan tugas'),tr('Low: unclear roles, blame after goals conceded','Rendah: peranan tak jelas, salah-menyalahkan bila dibolosi')]]),q:tr('What do you run first?','Apa yang anda jalankan dahulu?'),
   ...mkOpts(c,[tr('A karaoke night and hope it fixes everything','Malam karaoke dan harap semuanya selesai'),tr('Drop the players who complain','Gugurkan pemain yang merungut'),tr('Let the captain sort it out alone','Biar kapten selesaikan sendiri')]),
   learn:tr(`Carron's model separates task cohesion (working together toward goals) from social cohesion (liking each other). Task cohesion is more closely linked to performance, so role clarity, shared goals and agreed standards come first; social activities support but rarely fix task problems.`,
     `Model Carron memisahkan kesepaduan tugas (bekerjasama mencapai matlamat) daripada kesepaduan sosial (saling menyukai). Kesepaduan tugas lebih berkait dengan prestasi, jadi kejelasan peranan, matlamat bersama dan standard yang dipersetujui didahulukan; aktiviti sosial membantu tetapi jarang menyelesaikan masalah tugas.`)};},
 mindful(L,a){const c=tr('Notice the thought, name it ("there\'s the worry"), return attention to the next action','Sedari fikiran, namakannya ("itu kerisauan"), kembalikan tumpuan kepada tindakan seterusnya');
  return {title:tr('Thoughts that won\'t go away','Fikiran yang tak mahu hilang'),data:athCard(a)+tbl([[tr('Athlete says','Kata atlet'),tr('"I try to block negative thoughts but they get louder."','"Saya cuba sekat fikiran negatif tapi ia makin kuat."')],[tr('Approach','Pendekatan'),tr('Mindfulness–Acceptance–Commitment (MAC)','Kesedaran–Penerimaan–Komitmen (MAC)')]]),q:tr('Which instruction fits an acceptance-based approach?','Arahan manakah sesuai dengan pendekatan berasaskan penerimaan?'),
   ...mkOpts(c,[tr('Push the thought away as hard as you can','Tolak fikiran itu sekuat hati'),tr('Argue with the thought until you win','Berdebat dengan fikiran itu sehingga menang'),tr('Distract yourself with your phone','Alihkan perhatian dengan telefon')]),
   learn:tr(`Trying to suppress thoughts often makes them rebound. Acceptance-based approaches (MAC) teach athletes to notice thoughts and feelings without fighting them, then commit attention to valued, task-relevant actions.`,
     `Cuba menekan fikiran selalunya membuatkan ia kembali lebih kuat. Pendekatan berasaskan penerimaan (MAC) mengajar atlet menyedari fikiran dan perasaan tanpa melawannya, kemudian memberi komitmen tumpuan kepada tindakan yang bernilai dan berkaitan tugas.`)};},
 pressure(L,a){const c=tr('Add consequences and scrutiny in training: scoring, an audience, forfeits — then build coping on top','Tambah akibat dan pemerhatian dalam latihan: skor, penonton, denda — kemudian bina strategi menangani');
  return {title:tr('Penalties at the Games','Sepakan penalti di Temasya'),data:athCard(a)+tbl([[tr('Shoot-out record','Rekod penentuan'),tr('2 wins from 7','2 menang daripada 7')],[tr('Training','Latihan'),tr('Relaxed, no consequences','Santai, tiada akibat')]]),q:tr('How do you prepare the squad?','Bagaimana anda menyediakan skuad?'),
   ...mkOpts(c,[tr('Never practise penalties to avoid stress','Jangan berlatih penalti untuk elak tekanan'),tr('Practise thousands of relaxed penalties','Berlatih beribu penalti secara santai'),tr('Tell them it\'s just luck','Beritahu mereka ia cuma nasib')]),
   learn:tr(`Pressure training gradually adds stressors (consequences, judgement, time pressure) to practice so athletes adapt and test their coping skills. Research shows it can protect performance under real pressure when paired with mental skills like routines.`,
     `Latihan tekanan menambah tekanan secara beransur (akibat, penilaian, tekanan masa) dalam latihan supaya atlet menyesuaikan diri dan menguji kemahiran menangani. Kajian menunjukkan ia boleh melindungi prestasi dalam tekanan sebenar apabila digabungkan dengan kemahiran mental seperti rutin.`)};},
 ramadan(L,a){const c=tr('Plan together with the athlete, nutritionist and coach: session timing, sleep, and a routine that respects the fast','Rancang bersama atlet, pakar pemakanan dan jurulatih: masa sesi, tidur, dan rutin yang menghormati puasa');
  return {title:tr('Competing during Ramadan','Bertanding pada bulan Ramadan'),data:athCard(a)+tbl([[tr('Event','Acara'),tr('Final at 3 pm, fasting','Akhir pukul 3 petang, berpuasa')],[tr('Athlete says','Kata atlet'),tr('"I want to fast. I\'m worried about my energy and focus."','"Saya mahu berpuasa. Saya risau tentang tenaga dan fokus."')]]),q:tr('What is your role?','Apakah peranan anda?'),
   ...mkOpts(c,[tr('Tell them to stop fasting for performance','Suruh mereka berhenti berpuasa demi prestasi'),tr('Say nothing: it is a private matter and not your concern','Diam sahaja: ia hal peribadi dan bukan urusan anda'),tr('Decide on their behalf with the coach','Buat keputusan bagi pihak mereka bersama jurulatih')]),
   learn:tr(`Respect the athlete's values and choices; the psychologist's job is to help them perform within those choices. Collaborate across the team (nutrition for suhoor/iftar planning, coaching for session timing), protect sleep, and frame the fast as part of the athlete's identity rather than a barrier.`,
     `Hormati nilai dan pilihan atlet; tugas ahli psikologi ialah membantu mereka berprestasi dalam pilihan itu. Bekerjasama dengan pasukan (pemakanan untuk sahur/iftar, kejurulatihan untuk masa sesi), lindungi tidur, dan anggap puasa sebagai sebahagian identiti atlet, bukan halangan.`)};},
 social(L,a){const c=tr('Acknowledge the impact, document and report the abuse via the platform and centre, mute/limit access, and agree a social media plan','Akui kesannya, rekod dan laporkan penderaan melalui platform dan pusat, senyap/had akses, dan setuju pelan media sosial');
  return {title:tr('Abuse after a loss','Penderaan selepas kalah'),data:athCard(a)+tbl([[tr('Situation','Situasi'),tr('Hundreds of abusive comments after a missed shot','Ratusan komen kesat selepas gagal menjaring')],[tr('Athlete says','Kata atlet'),tr('"I can\'t stop reading them."','"Saya tak boleh berhenti membacanya."')]]),q:tr('What do you do first?','Apa yang anda lakukan dahulu?'),
   ...mkOpts(c,[tr('Tell them to reply and defend themselves','Suruh mereka balas dan pertahankan diri'),tr('Say it\'s part of being famous','Kata ia sebahagian daripada menjadi terkenal'),tr('Delete their account without asking','Padam akaun mereka tanpa bertanya')]),
   learn:tr(`Online abuse can affect wellbeing and performance. Validate the athlete, reduce exposure (filters, someone else monitoring the account), document and report through official channels, and plan posting habits around competitions. Serious threats go to the authorities.`,
     `Penderaan dalam talian boleh menjejaskan kesejahteraan dan prestasi. Iktiraf perasaan atlet, kurangkan pendedahan (penapis, orang lain memantau akaun), rekod dan laporkan melalui saluran rasmi, dan rancang tabiat memuat naik di sekitar pertandingan. Ancaman serius dilaporkan kepada pihak berkuasa.`)};},
 debrief(L,a){const c=tr('Let emotions settle first; next day, a structured review: what went well, what to improve, what we control next','Biar emosi reda dahulu; esoknya, semakan berstruktur: apa yang baik, apa perlu diperbaiki, apa yang kita kawal seterusnya');
  return {title:tr('Lost the semi-final','Kalah separuh akhir'),data:athCard(a)+tbl([[tr('Time','Masa'),tr('10 minutes after the match','10 minit selepas perlawanan')],[tr('Coach wants','Jurulatih mahu'),tr('A full video review tonight','Semakan video penuh malam ini')]]),q:tr('What do you advise?','Apa nasihat anda?'),
   ...mkOpts(c,[tr('Full video review now while it\'s fresh','Semakan video penuh sekarang semasa masih segar'),tr('Never talk about the loss','Jangan sesekali bercakap tentang kekalahan'),tr('Find out whose fault it was','Cari siapa yang bersalah')]),
   learn:tr(`Immediately after a loss emotions run high and learning is low. Separate an emotional check-in (now) from a structured debrief (later). Balance strengths and improvements, keep it about controllables, and finish with the next action.`,
     `Sejurus selepas kalah, emosi tinggi dan pembelajaran rendah. Pisahkan semakan emosi (sekarang) daripada taklimat berstruktur (kemudian). Seimbangkan kekuatan dan penambahbaikan, fokus pada perkara boleh dikawal, dan akhiri dengan tindakan seterusnya.`)};},
 transition(L,a){const c=tr('Explore identity beyond sport, plan dual-career steps early, and connect them with career services','Teroka identiti di luar sukan, rancang langkah kerjaya dwi lebih awal, dan hubungkan dengan perkhidmatan kerjaya');
  return {title:tr('Retiring after the Games','Bersara selepas Temasya'),data:athCard(a)+tbl([[tr('Situation','Situasi'),tr('Retiring in 6 months after 15 years','Bersara dalam 6 bulan selepas 15 tahun')],[tr('Athlete says','Kata atlet'),tr('"I don\'t know who I am without my sport."','"Saya tak tahu siapa saya tanpa sukan."')]]),q:tr('How do you support the transition?','Bagaimana anda menyokong peralihan ini?'),
   ...mkOpts(c,[tr('Wait until they retire, then start talking','Tunggu sehingga mereka bersara, kemudian baru berbincang'),tr('Tell them to keep competing as long as possible','Suruh mereka terus bertanding selama mungkin'),tr('It\'s not a psychology issue','Ini bukan isu psikologi')]),
   learn:tr(`A strong, exclusive athletic identity makes retirement harder, especially if it is unplanned. Starting early, exploring other roles and skills, keeping social connections, and planning education or work (dual career) ease the transition.`,
     `Identiti atlet yang kuat dan eksklusif menjadikan persaraan lebih sukar, terutamanya jika tidak dirancang. Bermula awal, meneroka peranan dan kemahiran lain, mengekalkan hubungan sosial, dan merancang pendidikan atau pekerjaan (kerjaya dwi) memudahkan peralihan.`)};},
 media(L,a){const c=tr('Prepare 2–3 key messages, rehearse tough questions, and agree a limit with the media officer','Sediakan 2–3 mesej utama, latih soalan sukar, dan tetapkan had bersama pegawai media');
  return {title:tr('Press conference before the final','Sidang media sebelum perlawanan akhir'),data:athCard(a)+tbl([[tr('Situation','Situasi'),tr('National media, 30 reporters','Media kebangsaan, 30 wartawan')],[tr('Athlete says','Kata atlet'),tr('"I freeze when they ask about the whole country watching."','"Saya kaku bila mereka tanya tentang seluruh negara menonton."')]]),q:tr('How do you prepare them?','Bagaimana anda menyediakan mereka?'),
   ...mkOpts(c,[tr('Skip all media without telling anyone','Elak semua media tanpa memberitahu sesiapa'),tr('Let them improvise: it\'s more authentic','Biar mereka spontan: lebih asli'),tr('Promise a gold medal to calm the reporters','Janji pingat emas untuk menenangkan wartawan')]),
   learn:tr(`Media pressure is predictable, so it can be rehearsed. Key messages that focus on process ("we'll play our game") deflect outcome pressure; mock interviews build confidence; and a clear plan with the media officer protects recovery time.`,
     `Tekanan media boleh dijangka, jadi ia boleh dilatih. Mesej utama yang fokus pada proses ("kami akan main cara kami") mengalihkan tekanan hasil; temu bual olok-olok membina keyakinan; dan pelan jelas bersama pegawai media melindungi masa pemulihan.`)};},
 confid(L,a){const c=tr('Explain confidentiality and its limits (risk of serious harm, legal requirements) at the first session','Terangkan kerahsiaan dan hadnya (risiko bahaya serius, keperluan undang-undang) pada sesi pertama');
  return {title:tr('First session with a new athlete','Sesi pertama dengan atlet baharu'),data:athCard(a)+tbl([[tr('Athlete asks','Atlet bertanya'),tr('"Will you tell the coach what I say?"','"Adakah awak akan beritahu jurulatih apa yang saya cakap?"')]]),q:tr('What is the best answer?','Apakah jawapan terbaik?'),
   ...mkOpts(c,[tr('"Everything you say stays secret, no matter what."','"Semua yang awak cakap kekal rahsia, walau apa pun."'),tr('"The coach gets a summary of every session."','"Jurulatih dapat ringkasan setiap sesi."'),tr('"Let\'s not talk about that."','"Kita tak payah cakap tentang itu."')]),
   learn:tr(`Confidentiality is the foundation of trust, but it is not absolute. Explain at the start what stays private, what you share only with consent, and the exceptions (serious risk to self or others, safeguarding, legal duties). Never promise total secrecy.`,
     `Kerahsiaan ialah asas kepercayaan, tetapi ia tidak mutlak. Terangkan dari awal apa yang kekal sulit, apa yang dikongsi hanya dengan persetujuan, dan pengecualiannya (risiko serius kepada diri atau orang lain, perlindungan, kewajipan undang-undang). Jangan sesekali menjanjikan kerahsiaan penuh.`)};},
 coachinfo(L,a){const c=tr('Share only what the athlete has agreed to, focused on how the coach can help','Kongsi hanya apa yang atlet setuju, fokus pada cara jurulatih boleh membantu');
  return {title:tr('The coach wants details','Jurulatih mahukan butiran'),data:athCard(a)+tbl([[tr('Coach','Jurulatih'),tr('"What did she tell you? I need to know for selection."','"Apa dia beritahu awak? Saya perlu tahu untuk pemilihan."')],[tr('Consent on file','Persetujuan dalam fail'),tr('General progress only','Kemajuan umum sahaja')]]),q:tr('How do you respond?','Bagaimana anda menjawab?'),
   ...mkOpts(c,[tr('Tell the coach everything: they are the boss','Beritahu jurulatih semuanya: dia bos'),tr('Refuse to speak to the coach at all','Enggan bercakap dengan jurulatih langsung'),tr('Hint at the details without saying them directly','Bagi bayangan butiran tanpa menyebutnya secara langsung')]),
   learn:tr(`In team settings, agree at the start what is shared and with whom. Coaches are important allies, so keep them informed about how to help (with consent) while protecting private content. Selection decisions should not depend on confidential sessions.`,
     `Dalam persekitaran pasukan, persetujui dari awal apa yang dikongsi dan dengan siapa. Jurulatih ialah rakan penting, jadi maklumkan mereka cara membantu (dengan persetujuan) sambil melindungi kandungan peribadi. Keputusan pemilihan tidak sepatutnya bergantung pada sesi sulit.`)};},
 referral(L,a){const c=tr('Thank them, stay supportive, assess immediate safety, and follow the referral pathway to the team doctor or clinical psychologist','Berterima kasih, terus menyokong, nilai keselamatan segera, dan ikut laluan rujukan kepada doktor pasukan atau ahli psikologi klinikal');
  return {title:tr('Beyond performance work','Melangkaui kerja prestasi'),data:athCard(a)+tbl([[tr('Shared with you','Dikongsi dengan anda'),tr('Low mood most days for 3 weeks, poor sleep, lost interest','Mood rendah hampir setiap hari selama 3 minggu, tidur lemah, hilang minat')],[tr('Your role','Peranan anda'),tr('Sport psychologist (performance)','Ahli psikologi sukan (prestasi)')]]),q:tr('What is the right next step?','Apakah langkah seterusnya yang betul?'),
   ...mkOpts(c,[tr('Keep it secret and treat it with performance skills alone','Rahsiakan dan rawat dengan kemahiran prestasi sahaja'),tr('Tell them to toughen up before trials','Suruh mereka kuatkan semangat sebelum pemilihan'),tr('Post a summary in the staff chat','Kongsi ringkasan dalam kumpulan sembang staf')]),
   learn:tr(`Know your competence. Persistent symptoms call for referral within your centre's pathway while you stay involved and supportive. Any immediate safety concern follows the emergency protocol; in Malaysia, crisis lines such as Talian HEAL 15555 and Befrienders KL (03-7627 2929) are examples to share — check your centre's current list.`,
     `Kenali kecekapan anda. Simptom berpanjangan memerlukan rujukan melalui laluan pusat sambil anda terus terlibat dan menyokong. Sebarang kebimbangan keselamatan segera mengikut protokol kecemasan; di Malaysia, talian krisis seperti Talian HEAL 15555 dan Befrienders KL (03-7627 2929) ialah contoh untuk dikongsi — semak senarai terkini pusat anda.`)};},
 dual(L,a){const c=tr('Decline politely and refer them to a colleague to avoid a dual relationship','Tolak dengan sopan dan rujuk kepada rakan sekerja untuk mengelak hubungan dwi-peranan');
  return {title:tr('Your cousin joins the squad','Sepupu anda menyertai skuad'),data:athCard(a)+tbl([[tr('Request','Permintaan'),tr('"Can you be my psychologist? You know me best."','"Boleh awak jadi ahli psikologi saya? Awak paling kenal saya."')],[tr('Relationship','Hubungan'),tr('Close family member','Ahli keluarga rapat')]]),q:tr('What do you do?','Apa tindakan anda?'),
   ...mkOpts(c,[tr('Accept: knowing them well is an advantage','Terima: kenal rapat ialah kelebihan'),tr('Accept but keep it secret from the department','Terima tetapi rahsiakan daripada jabatan'),tr('Ignore the request','Abaikan permintaan itu')]),
   learn:tr(`Dual relationships (family, friendship, business, or also being a selector) can impair objectivity and confidentiality. Where they can't be avoided — common in small sports systems — discuss them openly, set boundaries, document, and seek supervision.`,
     `Hubungan dwi-peranan (keluarga, kawan, perniagaan, atau turut menjadi pemilih) boleh menjejaskan objektiviti dan kerahsiaan. Jika tidak dapat dielakkan — biasa dalam sistem sukan yang kecil — bincangkan secara terbuka, tetapkan sempadan, dokumenkan, dan dapatkan penyeliaan.`)};},
 minors(L,a){const age=ri(13,16);const c=tr('Parental consent plus the athlete\'s own assent, with confidentiality explained in age-appropriate language','Persetujuan ibu bapa serta persetujuan atlet sendiri, dengan kerahsiaan diterangkan dalam bahasa sesuai umur');
  return {title:tr(`Working with a ${age}-year-old`,`Bekerja dengan atlet berumur ${age} tahun`),data:athCard(Object.assign({},a,{age}))+tbl([[tr('Referral from','Rujukan daripada'),tr('Youth academy coach','Jurulatih akademi belia')],[tr('Age','Umur'),age]]),q:tr('What consent do you need before starting?','Persetujuan apakah yang anda perlukan sebelum bermula?'),
   ...mkOpts(c,[tr('The coach\'s permission is enough','Kebenaran jurulatih sudah memadai'),tr('The athlete\'s verbal yes is enough','"Ya" lisan atlet sudah memadai'),tr('No consent needed for performance work','Tiada persetujuan diperlukan untuk kerja prestasi')]),
   learn:tr(`Under 18, parents or guardians give informed consent and the young athlete gives assent. Explain what you will do, who will know what, and safeguarding limits in language they understand. Work in visible spaces and follow your centre's child protection policy.`,
     `Bawah 18 tahun, ibu bapa atau penjaga memberi persetujuan termaklum dan atlet muda memberi persetujuan sendiri (assent). Terangkan apa yang akan dibuat, siapa akan tahu apa, dan had perlindungan dalam bahasa yang mereka faham. Bekerja di ruang yang boleh dilihat dan ikut polisi perlindungan kanak-kanak pusat anda.`)};},
 reds(L,a){const c=tr('Raise concerns privately and with care, then refer to the team doctor and dietitian through the MDT pathway','Bangkitkan kebimbangan secara peribadi dan berhati-hati, kemudian rujuk kepada doktor pasukan dan dietitian melalui laluan MDT');
  return {title:tr('Something seems off','Sesuatu tidak kena'),data:athCard(a)+tbl([[tr('You notice','Anda perasan'),tr('Skipping team meals, rigid food rules, extra secret training','Ponteng makan bersama pasukan, peraturan makan yang ketat, latihan tambahan secara rahsia')],[tr('Also','Juga'),tr('Recent stress fracture, missed periods mentioned to physio','Patah tekanan baru-baru ini, haid tidak datang dimaklumkan kepada fisio')]]),q:tr('What is the right step?','Apakah langkah yang betul?'),
   ...mkOpts(c,[tr('Put them on a diet plan yourself','Berikan pelan diet sendiri'),tr('Comment on their body shape to motivate them','Komen bentuk badan mereka untuk memotivasikan'),tr('Wait and see until performance drops','Tunggu dan lihat sehingga prestasi menurun')]),
   learn:tr(`Disordered eating and low energy availability (RED-S) are health issues with physical and psychological sides. Approach with care and without commenting on weight, then refer through the multidisciplinary team (doctor, dietitian, psychologist). Early action improves outcomes.`,
     `Gangguan makan dan ketersediaan tenaga rendah (RED-S) ialah isu kesihatan yang ada aspek fizikal dan psikologi. Dekati dengan berhati-hati tanpa mengulas berat badan, kemudian rujuk melalui pasukan pelbagai disiplin (doktor, dietitian, ahli psikologi). Tindakan awal meningkatkan hasil.`)};},
 pdpa(L,a){const c=tr('Secure, access-controlled case notes kept separately from the shared performance database, with consent recorded','Nota kes yang selamat dan berkawalan akses, disimpan berasingan daripada pangkalan data prestasi dikongsi, dengan persetujuan direkodkan');
  return {title:tr('Where do case notes live?','Di mana nota kes disimpan?'),data:tbl([[tr('Request','Permintaan'),tr('IT wants all psych notes uploaded to the squad performance dashboard','IT mahu semua nota psikologi dimuat naik ke papan pemuka prestasi skuad')],[tr('Law','Undang-undang'),tr('Personal Data Protection Act 2010 (PDPA)','Akta Perlindungan Data Peribadi 2010 (PDPA)')]]),q:tr('What is the right setup?','Apakah susunan yang betul?'),
   ...mkOpts(c,[tr('Upload everything: coaches need all the data','Muat naik semua: jurulatih perlukan semua data'),tr('Keep notes on your personal phone','Simpan nota dalam telefon peribadi'),tr('Don\'t write notes at all','Jangan tulis nota langsung')]),
   learn:tr(`Psychological records are sensitive personal data. Keep them secure and separate, limit access to those who need it, record consent for any sharing, and follow your centre's retention policy and the PDPA. Good notes also protect the athlete and you.`,
     `Rekod psikologi ialah data peribadi sensitif. Simpan dengan selamat dan berasingan, hadkan akses kepada yang memerlukan, rekod persetujuan untuk sebarang perkongsian, dan ikut polisi penyimpanan pusat serta PDPA. Nota yang baik juga melindungi atlet dan diri anda.`)};},
 supervision(L,a){const c=tr('Book supervision this week to process the case and look after your own wellbeing','Tempah sesi penyeliaan minggu ini untuk memproses kes dan menjaga kesejahteraan diri');
  return {title:tr('A heavy week','Minggu yang berat'),data:tbl([[tr('Caseload','Beban kes'),tr('12 athletes, two in crisis','12 atlet, dua dalam krisis')],[tr('You notice','Anda perasan'),tr('Poor sleep, thinking about cases at home','Tidur terganggu, asyik fikir tentang kes di rumah')]]),q:tr('What do you do?','Apa tindakan anda?'),
   ...mkOpts(c,[tr('Push through: asking for help looks weak','Teruskan saja: minta tolong nampak lemah'),tr('Take on more cases to stay busy','Ambil lebih banyak kes supaya sibuk'),tr('Vent about the cases to friends','Luahkan tentang kes kepada kawan-kawan')]),
   learn:tr(`Regular supervision is part of ethical practice at every career stage, not only for trainees. It improves decisions on complex cases and protects practitioners from burnout. Model the self-care you teach athletes.`,
     `Penyeliaan berkala ialah sebahagian amalan beretika di setiap peringkat kerjaya, bukan hanya untuk pelatih. Ia memperbaiki keputusan bagi kes kompleks dan melindungi pengamal daripada burnout. Tunjukkan penjagaan diri yang anda ajar kepada atlet.`)};},
 coachcomms(L,a){const c=tr('Three key points, what they mean for training, and one clear action — without breaching confidentiality','Tiga perkara utama, maksudnya untuk latihan, dan satu tindakan jelas — tanpa melanggar kerahsiaan');
  return {title:tr('The Head Coach wants answers','Ketua Jurulatih mahukan jawapan'),data:tbl([[tr('Coach','Jurulatih'),tr('Head Coach Dato\' Kamal','Ketua Jurulatih Dato\' Kamal')],[tr('Mood','Mood'),tr('"Psychology is taking too long. What are you actually doing?"','"Psikologi ambil masa terlalu lama. Apa sebenarnya yang awak buat?"')],[tr('You have','Masa anda'),tr('Two minutes before training','Dua minit sebelum latihan')]]),q:tr('How do you brief them?','Bagaimana anda memberi taklimat?'),
   ...mkOpts(c,[tr('Share each athlete\'s private notes to prove your value','Kongsi nota peribadi setiap atlet untuk membuktikan nilai anda'),tr('A 30-page theory document','Dokumen teori 30 muka surat'),tr('Refuse to explain: psychology is confidential','Enggan menerangkan: psikologi adalah sulit')]),
   learn:tr(`Coaches buy in when they see practical impact. Talk about squad-level themes, the skills being trained and how the coach can reinforce them — never private content without consent. Short, regular updates build trust.`,
     `Jurulatih memberi sokongan apabila mereka nampak kesan praktikal. Bincangkan tema peringkat skuad, kemahiran yang dilatih dan cara jurulatih boleh mengukuhkannya — tidak sesekali kandungan peribadi tanpa persetujuan. Kemas kini ringkas dan kerap membina kepercayaan.`)};},
};

/* ---------- counselling dialogues (OARS) ---------- */
const OARS=tr('OARS: Open questions, Affirmations, Reflections, Summaries','OARS: Soalan terbuka (Open), Pengiktirafan (Affirmations), Refleksi (Reflections), Rumusan (Summaries)');
const DLG={
 d_anx:{issue:'anx',turns:[
  {a:['"I\'m fine in training, but before matches my stomach turns and I can\'t think straight."','"Saya okay masa latihan, tapi sebelum perlawanan perut saya memulas dan tak boleh berfikir dengan jelas."'],o:[
   [['"Sounds like your body and mind go into overdrive before matches. What\'s that like for you?"','"Nampaknya badan dan fikiran awak jadi terlalu aktif sebelum perlawanan. Bagaimana rasanya bagi awak?"'],2,['Reflection plus an open question invites them to say more.','Refleksi bersama soalan terbuka menggalakkan mereka bercerita lebih.']],
   [['"Everyone gets nervous. Just relax."','"Semua orang gemuruh. Bertenang saja."'],-1,['Minimising and advice too early can make athletes feel unheard.','Memperkecil dan memberi nasihat terlalu awal boleh buat atlet rasa tidak didengari.']],
   [['"Do you get nervous often?"','"Awak selalu gemuruh?"'],0,['A closed question gets a yes/no; open questions gather richer information.','Soalan tertutup hanya dapat ya/tidak; soalan terbuka mengumpul maklumat lebih kaya.']]]},
  {a:['"I start thinking about letting everyone down. My family watches every match."','"Saya mula fikir tentang mengecewakan semua orang. Keluarga saya tonton setiap perlawanan."'],o:[
   [['"Your family matters a lot to you, and you want to make them proud."','"Keluarga sangat penting bagi awak, dan awak mahu buat mereka bangga."'],2,['A reflection of meaning shows you understand what is underneath.','Refleksi makna menunjukkan anda faham apa yang tersirat.']],
   [['"You shouldn\'t think about your family when you play."','"Awak tak patut fikir tentang keluarga bila bermain."'],-1,['"Should" statements can sound judgemental early on.','Ayat "patut" boleh kedengaran menghakimi pada peringkat awal.']],
   [['"Let\'s do a breathing exercise right now."','"Jom kita buat latihan pernafasan sekarang."'],0,['Good tool, but too soon — understand the problem before fixing it.','Alat yang baik, tetapi terlalu awal — fahami masalah sebelum menyelesaikannya.']]]},
  {a:['"I guess I just want to enjoy playing again without all this."','"Saya rasa saya cuma mahu seronok bermain semula tanpa semua ini."'],o:[
   [['"So, nerves before matches, worry about letting family down, and you want to enjoy it again. Shall we work on that together?"','"Jadi, gemuruh sebelum perlawanan, risau mengecewakan keluarga, dan awak mahu seronok semula. Boleh kita usahakan bersama?"'],2,['A summary checks understanding and leads naturally to a shared goal.','Rumusan menyemak kefahaman dan membawa secara semula jadi kepada matlamat bersama.']],
   [['"Okay. See you next week."','"Okay. Jumpa minggu depan."'],-1,['Ending without a summary or plan loses momentum.','Menamatkan tanpa rumusan atau pelan menghilangkan momentum.']],
   [['"Enjoyment isn\'t important at this level."','"Keseronokan tak penting pada tahap ini."'],-2,['This dismisses the athlete\'s stated goal and harms rapport.','Ini menolak matlamat yang atlet nyatakan dan merosakkan hubungan.']]]}]},
 d_conf:{issue:'conf',turns:[
  {a:['"They dropped me from the squad. Maybe I was never good enough."','"Mereka gugurkan saya dari skuad. Mungkin saya memang tak cukup bagus."'],o:[
   [['"Being dropped has really shaken how you see yourself."','"Digugurkan benar-benar menggoncang cara awak melihat diri sendiri."'],2,['Reflecting the feeling and its impact builds trust.','Merefleksi perasaan dan kesannya membina kepercayaan.']],
   [['"Of course you\'re good enough! Don\'t say that."','"Mestilah awak cukup bagus! Jangan cakap begitu."'],0,['Reassurance is kind but can shut the conversation down.','Menenangkan itu baik tetapi boleh menutup perbualan.']],
   [['"What did you do wrong?"','"Apa yang awak buat salah?"'],-1,['Blame-focused questions increase defensiveness.','Soalan yang menumpukan kesalahan meningkatkan sikap defensif.']]]},
  {a:['"I used to be the best junior in my state. Now I don\'t even want to train."','"Dulu saya junior terbaik di negeri saya. Sekarang saya tak mahu berlatih pun."'],o:[
   [['"You\'ve achieved a lot to get here. What helped you back then?"','"Awak dah capai banyak untuk sampai ke sini. Apa yang membantu awak dulu?"'],2,['An affirmation plus a strengths-based question reconnects them with past success.','Pengiktirafan bersama soalan berasaskan kekuatan menghubungkan mereka semula dengan kejayaan lalu.']],
   [['"If you don\'t train, you\'ll never get back."','"Kalau awak tak berlatih, awak takkan kembali."'],-1,['Pressure and threats reduce motivation.','Tekanan dan ugutan mengurangkan motivasi.']],
   [['"Lots of people get dropped."','"Ramai orang digugurkan."'],0,['Normalising can help, but it misses their personal story.','Menormalkan boleh membantu, tetapi terlepas cerita peribadi mereka.']]]},
  {a:['"Back then I just played. I didn\'t think about selection."','"Dulu saya main saja. Saya tak fikir tentang pemilihan."'],o:[
   [['"So focusing on how you play, rather than selection, used to bring out your best. Want to rebuild that?"','"Jadi fokus pada cara awak bermain, bukan pemilihan, dulu membawa keluar yang terbaik. Mahu bina semula itu?"'],2,['Summarising their own insight turns it into a plan they own.','Merumus pandangan mereka sendiri menjadikannya pelan yang mereka miliki.']],
   [['"Well, selection is all that matters now."','"Sekarang pemilihan saja yang penting."'],-2,['This reinforces the outcome focus that is hurting them.','Ini mengukuhkan fokus hasil yang sedang menjejaskan mereka.']],

 d_focus:{issue:'focus',turns:[

   [['"Just forget it and move on."','"Lupakan saja dan teruskan."'],-1,['If it were that easy they would already do it.','Kalau semudah itu mereka dah lama buat.']],

   [['"I have a better routine for you."','"Saya ada rutin yang lebih baik untuk awak."'],0,['Your routine might be good, but their own idea is more likely to stick.','Rutin anda mungkin baik, tetapi idea mereka sendiri lebih mungkin kekal.']],

 d_burn:{issue:'burn',turns:[
  {a:['"I used to love this. Now training just feels empty."','"Dulu saya suka sukan ini. Sekarang latihan terasa kosong."'],o:[
   [['"Something you loved has started to feel empty. That sounds hard."','"Sesuatu yang awak cintai mula terasa kosong. Itu kedengaran berat."'],2,['Empathic reflection validates without judging.','Refleksi empati mengiktiraf tanpa menghakimi.']],
   [['"Every athlete has bad weeks."','"Semua atlet ada minggu yang teruk."'],0,['True, but it can minimise a longer-term problem.','Benar, tetapi ia boleh memperkecil masalah jangka panjang.']],

 d_inj:{issue:'inj',turns:[
  {a:['"The physio says my knee is ready. But every time I cut, I see it snapping again."','"Fisio kata lutut saya dah sedia. Tapi setiap kali menukar arah, saya nampak ia putus lagi."'],o:[
   [['"Your body may be ready, but your mind is still protecting you. That\'s understandable after what happened."','"Badan awak mungkin dah sedia, tapi fikiran awak masih melindungi awak. Itu boleh difahami selepas apa yang berlaku."'],2,['Normalising and validating fear reduces shame.','Menormalkan dan mengiktiraf rasa takut mengurangkan rasa malu.']],

 d_low:{issue:'low',turns:[
  {a:['"I haven\'t felt like myself for weeks. Nothing feels worth it anymore."','"Dah berminggu-minggu saya rasa bukan diri sendiri. Tiada apa yang rasa berbaloi lagi."'],o:[
   [['"Thank you for telling me. It sounds really heavy. Can you tell me more about what these weeks have been like?"','"Terima kasih kerana memberitahu saya. Kedengaran sangat berat. Boleh ceritakan lebih lanjut bagaimana minggu-minggu ini?"'],2,['Thanking, validating and gently exploring is the right start.','Berterima kasih, mengiktiraf dan meneroka dengan lembut ialah permulaan yang betul.']],

   [['"Try some extra training to lift your mood."','"Cuba latihan tambahan untuk naikkan mood."'],-1,['Adding load without assessment can make things worse.','Menambah beban tanpa penilaian boleh memburukkan keadaan.']],
   [['"I\'m sure it will pass."','"Saya pasti ia akan berlalu."'],-1,['False reassurance can delay help.','Jaminan palsu boleh melambatkan bantuan.']]]},

  learn:['Ask directly about safety; asking does not plant ideas. Follow your emergency protocol if there is immediate risk, and make a warm, accompanied referral. In Malaysia, Talian HEAL 15555 and Befrienders KL (03-7627 2929) are examples of support lines — check your centre\'s current list.','Tanya secara langsung tentang keselamatan; bertanya tidak menanam idea. Ikut protokol kecemasan jika ada risiko segera, dan buat rujukan yang mesra serta ditemani. Di Malaysia, Talian HEAL 15555 dan Befrienders KL (03-7627 2929) ialah contoh talian sokongan — semak senarai terkini pusat anda.']},
